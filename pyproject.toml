[project]
name = "model-wtf"
version = "0.1.0"
description = "Model W Transformation Facilitator"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rémy Sanchez", email = "remy.sanchez@hyperthese.net" },
]
requires-python = ">=3.12"
dependencies = [
    "rich",
    "rich-click",
    "click",
    "httpx",
    "pyyaml",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
    "jinja2>=3.1.6",
]

[project.scripts]
model-wtf = "model_wtf.cli:cli"

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "types-pyyaml",
]
test = [
    "pytest",
]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["uv_build>=0.9.5,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src"]
# The Django introspection script runs inside the *target* project's
# interpreter (Django, Ninja... are not deps of model-wtf); it is
# type-checked loosely and its Django imports are untyped by design.
exclude = ["src/model_wtf/extractors/django/_introspect\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["eval"]
addopts = ["-q", "-ra", "--tb=short"]
filterwarnings = [
    # rich-click still imports click 8 helpers slated for removal in click 9;
    # nothing actionable on our side.
    "ignore:.*deprecated and will be removed in Click 9.0:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# Eval fixtures are Django code the agents read, not part of this package.
extend-exclude = ["tests/eval/template"]

[tool.ruff.lint]
select = [
    # -- Core --
    "E",  # pycodestyle (errors)
    "W",  # pycodestyle (warnings)
    "F",  # Pyflakes
    "I",  # isort
    "C90",  # McCabe Complexity
    "D1",  # Mandatory docstrings
    "S",  # Bandit

    # -- Bonus --
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "DTZ",  # date/time zone
    "T10",  # debugger
    "EM",  # error messages
    "EXE",  # executable
    "G",  # logging
    "UP",  # pyupgrade
    "ASYNC",  # async
    "INP",  # PEP 420
    "T20",  # no print
    "PT",  # pytest
    "SLOT",  # slots
    "TCH",  # type checking blocks
    "PTH",  # Use pathlib
    "FIX",  # Don't allow not done stuff in code
    "ERA",  # Don't comment code
    "RUF",  # Ruff stuff
    "TID251",  # Banned imports (See below)
]

# D104 -- package __init__.py files don't need docstrings
# D105 -- magic methods are self-describing
ignore = ["D104", "D105"]

[tool.ruff.lint.per-file-ignores]
# Tests: fixtures shadow args, asserts are the point, docstrings are noise.
"tests/*" = ["ARG001", "S101", "D", "INP001"]
# Standalone script piped into a foreign interpreter: best-effort probes
# (try/except/pass), long heuristic tables, no strict complexity budget.
"src/model_wtf/extractors/django/_introspect.py" = ["C901", "S110", "S112", "BLE001", "D1", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["model_wtf"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `httpx` instead, which has timeouts by default."
