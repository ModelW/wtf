sid: INP05
title: Command Line Execution through SQL Injection
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False
severity: Very High
likelihood: null
details: An attacker uses standard SQL injection methods to inject data into the command line
  for execution. This could be done directly through misuse of directives such as MSSQL_xp_cmdshell
  or indirectly through injection of data into the database that would be interpreted as shell
  commands. Sometime later, an unscrupulous backend application (or could be part of the functionality
  of the same application) fetches the injected data stored in the database and uses this
  data as command line arguments without performing proper validation. The malicious data
  escapes that data plane by spawning new commands to be executed on the host.
mitigations: Disable MSSQL xp_cmdshell directive on the databaseProperly validate the data
  (syntactically and semantically) before writing it to the database. Do not implicitly trust
  the data stored in the database. Re-validate it prior to usage to make sure that it is safe
  to use in a given context (e.g. as a command line argument).
example: 'SQL injection vulnerability in Cacti 0.8.6i and earlier, when register_argc_argv
  is enabled, allows remote attackers to execute arbitrary SQL commands via the (1) second
  or (2) third arguments to cmd.php. NOTE: this issue can be leveraged to execute arbitrary
  commands since the SQL query results are later used in the polling_items array and popen
  function'
references: https://capec.mitre.org/data/definitions/108.html, http://cwe.mitre.org/data/definitions/89.html,
  http://cwe.mitre.org/data/definitions/74.html, http://cwe.mitre.org/data/definitions/20.html,
  http://cwe.mitre.org/data/definitions/78.html, http://cwe.mitre.org/data/definitions/114.html
prerequisites: The application does not properly validate data before storing in the databaseBackend
  application implicitly trusts the data stored in the databaseMalicious data is used on the
  backend as a command line argument
