sid: API02
title: Exploit Script-Based APIs
source: pytm v1.4.0
pytm_targets:
- Process
- Lambda
elements:
- process
condition: target.implementsAPI is True and target.controls.validatesInput is False
severity: Medium
likelihood: null
details: Some APIs support scripting instructions as arguments. Methods that take scripted
  instructions (or references to scripted instructions) can be very flexible and powerful.
  However, if an attacker can specify the script that serves as input to these methods they
  can gain access to a great deal of functionality. For example, HTML pages support <script>
  tags that allow scripting languages to be embedded in the page and then interpreted by the
  receiving web browser. If the content provider is malicious, these scripts can compromise
  the client application. Some applications may even execute the scripts under their own identity
  (rather than the identity of the user providing the script) which can allow attackers to
  perform activities that would otherwise be denied to them.
mitigations: Always use HTTPS and SSL Certificates. Firewall optimizations to prevent unauthorized
  access to or from a private network. Use strong authentication and authorization mechanisms.
  A proven protocol is OAuth 2.0, which enables a third-party application to obtain limited
  access to an API. Use IP whitelisting and rate limiting.
example: Since APIs can be accessed over the internet just like any other URI with some sensitive
  data attached to the request, they share the vulnerabilities of any other resource accessible
  on the internet like Man-in-the-middle, CSRF Attack, Denial of Services, etc.
references: https://capec.mitre.org/data/definitions/160.html, http://cwe.mitre.org/data/definitions/346.html
prerequisites: The target application must include the use of APIs that execute scripts.The
  target application must allow the attacker to provide some or all of the arguments to one
  of these script interpretation methods and must fail to adequately filter these arguments
  for dangerous or unwanted script commands.
