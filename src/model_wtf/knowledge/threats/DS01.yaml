sid: DS01
title: Excavation
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: (target.controls.sanitizesInput is False or target.controls.validatesInput is False)
  or target.controls.encodesOutput is False
severity: Medium
likelihood: null
details: An adversary actively probes the target in a manner that is designed to solicit information
  that could be leveraged for malicious purposes. This is achieved by exploring the target
  via ordinary interactions for the purpose of gathering intelligence about the target, or
  by sending data that is syntactically invalid or non-standard in an attempt to produce a
  response that contains the desired data. As a result of these interactions, the adversary
  is able to obtain information from the target that aids the attacker in making inferences
  about its security, configuration, or potential vulnerabilities. Examplar exchanges with
  the target may trigger unhandled exceptions or verbose error messages that reveal information
  like stack traces, configuration information, path information, or database design. This
  type of attack also includes the manipulation of query strings in a URI to produce invalid
  SQL queries, or by trying alternative path values in the hope that the server will return
  useful information.
mitigations: Minimize error/response output to only what is necessary for functional use or
  corrective language. Remove potentially sensitive information that is not necessary for
  the application's functionality.
example: The adversary may collect this information through a variety of methods including
  active querying as well as passive observation. By exploiting weaknesses in the design or
  configuration of the target and its communications, an adversary is able to get the target
  to reveal more information than intended. Information retrieved may aid the adversary in
  making inferences about potential weaknesses, vulnerabilities, or techniques that assist
  the adversary's objectives. This information may include details regarding the configuration
  or capabilities of the target, clues as to the timing or nature of activities, or otherwise
  sensitive information. Often this sort of attack is undertaken in preparation for some other
  type of attack, although the collection of information by itself may in some cases be the
  end goal of the adversary.
references: https://capec.mitre.org/data/definitions/116.html, http://cwe.mitre.org/data/definitions/200.html
prerequisites: An adversary requires some way of interacting with the system.
