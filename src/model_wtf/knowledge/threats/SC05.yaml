sid: SC05
title: Removing Important Client Functionality
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.providesIntegrity is False or target.controls.usesCodeSigning is
  False
severity: High
likelihood: null
details: An attacker removes or disables functionality on the client that the server assumes
  to be present and trustworthy. Attackers can, in some cases, get around logic put in place
  to 'guard' sensitive functionality or data. Client applications may include functionality
  that a server relies on for correct and secure operation. This functionality can include,
  but is not limited to, filters to prevent the sending of dangerous content to the server,
  logical functionality such as price calculations, and authentication logic to ensure that
  only authorized users are utilizing the client. If an attacker can disable this functionality
  on the client, they can perform actions that the server believes are prohibited. This can
  result in client behavior that violates assumptions by the server leading to a variety of
  possible attacks. In the above examples, this could include the sending of dangerous content
  (such as scripts) to the server, incorrect price calculations, or unauthorized access to
  server resources.
mitigations: 'Design: For any security checks that are performed on the client side, ensure
  that these checks are duplicated on the server side.Design: Ship client-side application
  with integrity checks (code signing) when possible.Design: Use obfuscation and other techniques
  to prevent reverse engineering the client code.'
example: Attacker reverse engineers a Java binary (by decompiling it) and identifies where
  license management code exists. Noticing that the license manager returns TRUE or FALSE
  as to whether or not the user is licensed, the Attacker simply overwrites both branch targets
  to return TRUE, recompiles, and finally redeploys the binary.Attacker uses click-through
  exploration of a Servlet-based website to map out its functionality, taking note of its
  URL-naming conventions and Servlet mappings. Using this knowledge and guessing the Servlet
  name of functionality they're not authorized to use, the Attacker directly navigates to
  the privileged functionality around the authorizing single-front controller (implementing
  programmatic authorization checks).Attacker reverse-engineers a Java binary (by decompiling
  it) and identifies where license management code exists. Noticing that the license manager
  returns TRUE or FALSE as to whether or not the user is licensed, the Attacker simply overwrites
  both branch targets to return TRUE, recompiles, and finally redeploys the binary.
references: http://cwe.mitre.org/data/definitions/602.html
prerequisites: The targeted server must assume the client performs important actions to protect
  the server or the server functionality. For example, the server may assume the client filters
  outbound traffic or that the client performs all price calculations correctly. Moreover,
  the server must fail to detect when these assumptions are violated by a client.
