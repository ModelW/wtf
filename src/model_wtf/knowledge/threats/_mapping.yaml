DO03: {element: [flow], dismiss: [no_xml], topic: dos}
DO04: {element: [flow], dismiss: [no_xml], topic: dos}
CR07: {element: [flow], dismiss: [no_xml], topic: input}
INP19: {element: [process], dismiss: [no_xml], topic: input}
