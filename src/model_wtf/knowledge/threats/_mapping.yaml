# --- LLM / agents: only where a touchpoint's files call one -------------------
# The smoke test is a grep for the SDKs and API key names (`no_llm`). The
# LLM itself is a party the touchpoint transfers to; these cells ask what
# the touchpoint lets through to it and back.
LLM01: {element: [process], dismiss: [no_llm], topic: llm, note: "user input reaches the prompt"}
LLM02: {element: [process], dismiss: [no_llm], topic: llm, note: "retrieved content (RAG, tool results) reaches the prompt"}
LLM03: {element: [process], dismiss: [no_llm, flow_not_personal], topic: llm, note: "personal data sent to the provider; is it a declared transfer with a DPA"}
LLM04: {element: [process], dismiss: [no_llm], topic: llm, note: "fine-tuning data integrity (rare in our stacks)"}
LLM05: {element: [process], dismiss: [no_llm], topic: llm, note: "tool calls the model can trigger and what they may touch"}
LLM06: {element: [process], dismiss: [no_llm], topic: llm, note: "model output executed as code"}
LLM07: {element: [process], dismiss: [no_llm], topic: llm, note: "system prompt relied upon as a safety control"}
