# How model-wtf treats each pytm threat (SID). `threats gen` refuses to run
# when a SID in pytm's library is missing here: a pytm bump is a decision for
# the model-wtf developer, not a silent gap.
#
# One entry per SID:
#   never: <why>                — impossible in the stacks we generate
#                                 (memory-safe runtimes, no PHP/LDAP/SOAP...),
#                                 or about infra we do not model. Kept in the
#                                 catalogue so the matrix says why.
#   review: <topic>             — an agent (or a human) has to look. `topic`
#                                 groups cells for the swarm.
#   dismiss:                    — deterministic, SIMPLE facts; any one of them
#     - <rule id>                 dismisses the cell for that element. Rules
#                                 are defined in `_rules.yaml`. When no rule
#                                 fires the cell is `review` under `topic`.
#   topic: <topic>
#   element: [process|store|party|flow]   which of our elements the threat
#                                 applies to (pytm targets translated: Process
#                                 and Server → process (touchpoint), Datastore
#                                 → store, ExternalEntity → party, Dataflow →
#                                 flow, Lambda/LLM/Agent → dropped).
#   note: <text>                — anything a reader should know.

# --- memory / native / not our runtimes -----------------------------------
INP01: {never: "memory-safe runtimes (Python, Node); no buffer arithmetic on env vars"}
INP02: {never: "memory-safe runtimes; buffer overflows are the interpreter's problem, patched by dependency updates, not per touchpoint"}
INP07: {never: "memory-safe runtimes"}
INP12: {never: "memory-safe runtimes"}
INP24: {never: "memory-safe runtimes; oversize input is DO02 (excessive allocation) here"}
INP34: {element: [process], dismiss: [no_soap], topic: input, note: "SOAP array overflow: only where the touchpoint consumes a SOAP service (zeep, suds)"}
INP08: {never: "Python str formatting and JS template literals do not interpret user data as format directives; logging uses %-style with arguments"}
INP13: {never: "no shell command built from input in the generated stacks (subprocess with a list is the rule); a touchpoint that shells out is INP31"}

# --- technologies absent from the stacks ------------------------------------
INP03: {never: "no Server Side Includes: Django templates and SvelteKit render on the app server"}
INP06: {element: [process], dismiss: [no_request, no_soap], topic: input, note: "SOAP parameter tampering: only where the touchpoint calls a SOAP service with request data"}
INP09: {never: "no LDAP"}
INP15: {never: "no IMAP/SMTP command built from input; mail goes through Django's mail backend with header validation (BadHeaderError)"}
INP16: {never: "no PHP"}
AC08: {never: "no registry"}
AC14: {never: "no privileged block / signal handling exposed to input"}
AC13: {never: "no privileged process to hijack inside the app"}
INP20: {never: "clickjacking is a response-header concern handled once by XFrameOptionsMiddleware / SvelteKit CSP, not per touchpoint; belongs to the security-settings review (DEBUG, cookie flags, headers, ALLOWED_HOSTS: one check per unit, outside this matrix)"}

