INP22: {element: [process], dismiss: [no_xml], topic: input}
INP32: {element: [process], dismiss: [no_xml], topic: input}
DO05: {element: [process], dismiss: [no_xml], topic: dos}
AC15: {element: [process], dismiss: [no_xml], topic: input, note: "schema poisoning: XML/JSON schema loaded from input; JSON schemas here are code"}

