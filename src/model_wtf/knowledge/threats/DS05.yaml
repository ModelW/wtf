sid: DS05
title: Lifting Sensitive Data Embedded in Cache
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.usesCache is True
severity: Medium
likelihood: null
details: An attacker examines a target application's cache for sensitive information. Many
  applications that communicate with remote entities or which perform intensive calculations
  utilize caches to improve efficiency. However, if the application computes or receives sensitive
  information and the cache is not appropriately protected, an attacker can browse the cache
  and retrieve this information. This can result in the disclosure of sensitive information.
mitigations: Remove potentially sensitive information from cache that is not necessary for
  the application's functionality.
example: An adversary actively probes the target in a manner that is designed to solicit information
  that could be leveraged for malicious purposes. This is achieved by exploring the target
  via ordinary interactions for the purpose of gathering intelligence about the target, or
  by sending data that is syntactically invalid or non-standard in an attempt to produce a
  response that contains the desired data. As a result of these interactions, the adversary
  is able to obtain information from the target that aids the attacker in making inferences
  about its security, configuration, or potential vulnerabilities.
references: https://capec.mitre.org/data/definitions/204.html, http://cwe.mitre.org/data/definitions/524.html,
  http://cwe.mitre.org/data/definitions/311.html
prerequisites: The target application must store sensitive information in a cache.The cache
  must be inadequately protected against attacker access.
