sid: INP10
title: Parameter Injection
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False
severity: Medium
likelihood: null
details: An adversary manipulates the content of request parameters for the purpose of undermining
  the security of the target. Some parameter encodings use text characters as separators.
  For example, parameters in a HTTP GET message are encoded as name-value pairs separated
  by an ampersand (&). If an attacker can supply text strings that are used to fill in these
  parameters, then they can inject special characters used in the encoding scheme to add or
  modify parameters. For example, if user input is fed directly into an HTTP GET request and
  the user provides the value myInput&new_param=myValue, then the input parameter is set to
  myInput, but a new parameter (new_param) is also added with a value of myValue. This can
  significantly change the meaning of the query that is processed by the server. Any encoding
  scheme where parameters are identified and separated by text characters is potentially vulnerable
  to this attack - the HTTP GET encoding used above is just one example.
mitigations: Implement an audit log written to a separate host. In the event of a compromise,
  the audit log may be able to provide evidence and details of the compromise. Treat all user
  input as untrusted data that must be validated before use.
example: The target application accepts a string as user input, fails to sanitize characters
  that have a special meaning in the parameter encoding, and inserts the user-supplied string
  in an encoding which is then processed.
references: https://capec.mitre.org/data/definitions/137.html, http://cwe.mitre.org/data/definitions/88.html
prerequisites: The target application must use a parameter encoding where separators and parameter
  identifiers are expressed in regular text.The target application must accept a string as
  user input, fail to sanitize characters that have a special meaning in the parameter encoding,
  and insert the user-supplied string in an encoding which is then processed.
