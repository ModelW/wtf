sid: AC14
title: Catching exception throw/signal from privileged block
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.implementsPOLP is False and (target.usesEnvironmentVariables is
  True or target.controls.validatesInput is False)
severity: Very High
likelihood: null
details: Attackers can sometimes hijack a privileged thread from the underlying system through
  synchronous (calling a privileged function that returns incorrectly) or asynchronous (callbacks,
  signal handlers, and similar) means. Having done so, the Attacker may not only likely access
  functionality the system's designer didn't intend for them, but they may also go undetected
  or deny other users essential service in a catastrophic (or insidiously subtle) way.
mitigations: Application Architects must be careful to design callback, signal, and similar
  asynchronous constructs such that they shed excess privilege prior to handing control to
  user-written (thus untrusted) code.Application Architects must be careful to design privileged
  code blocks such that upon return (successful, failed, or unpredicted) that privilege is
  shed prior to leaving the block/scope.
example: Attacker targets an application written using Java's AWT, with the 1.2.2 era event
  model. In this circumstance, any AWTEvent originating in the underlying OS (such as a mouse
  click) would return a privileged thread. The Attacker could choose to not return the AWT-generated
  thread upon consuming the event, but instead leveraging its privilege to conduct privileged
  operations.
references: https://capec.mitre.org/data/definitions/236.html, http://cwe.mitre.org/data/definitions/270.html
prerequisites: The application in question employs a threaded model of execution with the
  threads operating at, or having the ability to switch to, a higher privilege level than
  normal usersIn order to feasibly execute this class of attacks, the attacker must have the
  ability to hijack a privileged thread.This ability includes, but is not limited to, modifying
  environment variables that affect the process the thread belongs to, or providing malformed
  user-controllable input that causes the executing thread to fault and return to a higher
  privilege level or such.This does not preclude network-based attacks, but makes them conceptually
  more difficult to identify and execute.
