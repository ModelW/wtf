sid: SC01
title: JSON Hijacking (aka JavaScript Hijacking)
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.implementsNonce is False and any(d.format == 'JSON' for d in target.data)
severity: High
likelihood: null
details: An attacker targets a system that uses JavaScript Object Notation (JSON) as a transport
  mechanism between the client and the server (common in Web 2.0 systems using AJAX) to steal
  possibly confidential information transmitted from the server back to the client inside
  the JSON object by taking advantage of the loophole in the browser's Same Origin Policy
  that does not prohibit JavaScript from one website to be included and executed in the context
  of another website. An attacker gets the victim to visit his or her malicious page that
  contains a script tag whose source points to the vulnerable system with a URL that requests
  a response from the server containing a JSON object with possibly confidential information.
  The malicious page also contains malicious code to capture the JSON object returned by the
  server before any other processing on it can take place, typically by overriding the JavaScript
  function used to create new objects. This hook allows the malicious code to get access to
  the creation of each object and transmit the possibly sensitive contents of the captured
  JSON object to the attackers' server. There is nothing in the browser's security model to
  prevent the attackers' malicious JavaScript code (originating from attacker's domain) to
  set up an environment (as described above) to intercept a JSON object response (coming from
  the vulnerable target system's domain), read its contents and transmit to the attackers'
  controlled site. The same origin policy protects the domain object model (DOM), but not
  the JSON.
mitigations: Ensure that server side code can differentiate between legitimate requests and
  forged requests. The solution is similar to protection against Cross Site Request Forger
  (CSRF), which is to use a hard to guess random nonce (that is unique to the victim's session
  with the server) that the attacker has no way of knowing (at least in the absence of other
  weaknesses). Each request from the client to the server should contain this nonce and the
  server should reject all requests that do not contain the nonce. On the client side, the
  system's design could make it difficult to get access to the JSON object content via the
  script tag. Since the JSON object is never assigned locally to a variable, it cannot be
  readily modified by the attacker before being used by a script tag. For instance, if while(1)
  was added to the beginning of the JavaScript returned by the server, trying to access it
  with a script tag would result in an infinite loop. On the other hand, legitimate client
  side code can remove the while(1) statement after which the JavaScript can be evaluated.
  A similar result can be achieved by surrounding the returned JavaScript with comment tags,
  or using other similar techniques (e.g. wrapping the JavaScript with HTML tags). Make the
  URLs in the system used to retrieve JSON objects unpredictable and unique for each user
  session. 4. Ensure that to the extent possible, no sensitive data is passed from the server
  to the client via JSON objects. JavaScript was never intended to play that role, hence the
  same origin policy does not adequate address this scenario.
example: Gmail service was found to be vulnerable to a JSON Hijacking attack that enabled
  an attacker to get the contents of the victim's address book. An attacker could send an
  e-mail to the victim's Gmail account (which ensures that the victim is logged in to Gmail
  when he or she receives it) with a link to the attackers' malicious site. If the victim
  clicked on the link, a request (containing the victim's authenticated session cookie) would
  be sent to the Gmail servers to fetch the victim's address book. This functionality is typically
  used by the Gmail service to get this data on the fly so that the user can be provided a
  list of contacts from which to choose the recipient of the e-mail. When the JSON object
  with the contacts came back, it was loaded into the JavaScript space via a script tag on
  the attackers' malicious page. Since the JSON object was never assigned to a local variable
  (which would have prevented a script from a different domain accessing it due to the browser's
  same origin policy), another mechanism was needed to access the data that it contained.
  That mechanism was overwriting the internal array constructor with the attackers' own constructor
  in order to gain access to the JSON object's contents. These contents could then be transferred
  to the site controlled by the attacker.
references: https://capec.mitre.org/data/definitions/111.html, http://cwe.mitre.org/data/definitions/345.html,
