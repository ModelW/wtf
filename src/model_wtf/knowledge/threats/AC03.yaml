sid: AC03
title: Subverting Environment Variable Values
source: pytm v1.4.0
pytm_targets:
- Process
- Lambda
elements:
- process
condition: target.usesEnvironmentVariables is True and (target.controls.implementsAuthenticationScheme
  is False or target.controls.validatesInput is False or target.controls.authorizesSource
  is False)
severity: Very High
likelihood: null
details: The attacker directly or indirectly modifies environment variables used by or controlling
  the target software. The attacker's goal is to cause the target software to deviate from
  its expected operation in a manner that benefits the attacker.
mitigations: Protect environment variables against unauthorized read and write access. Protect
  the configuration files which contain environment variables against illegitimate read and
  write access. Assume all input is malicious. Create a white list that defines all valid
  input to the software system based on the requirements specifications. Input that does not
  match against the white list should not be permitted to enter into the system. Apply the
  least privilege principles. If a process has no legitimate reason to read an environment
  variable do not give that privilege.
example: 'Changing the LD_LIBRARY_PATH environment variable in TELNET will cause TELNET to
  use an alternate (possibly Trojan) version of a function library. The Trojan library must
  be accessible using the target file system and should include Trojan code that will allow
  the user to log in with a bad password. This requires that the attacker upload the Trojan
  library to a specific location on the target. As an alternative to uploading a Trojan file,
  some file systems support file paths that include remote addresses, such as 172.16.2.100shared_filestrojan_dll.dll.
  See also: Path Manipulation (CVE-1999-0073). The HISTCONTROL environment variable keeps
  track of what should be saved by the history command and eventually into the ~/.bash_history
  file when a user logs out. This setting can be configured to ignore commands that start
  with a space by simply setting it to ignorespace. HISTCONTROL can also be set to ignore
  duplicate commands by setting it to ignoredups. In some Linux systems, this is set by default
  to ignoreboth which covers both of the previous examples. This means that “ ls” will not
  be saved, but “ls” would be saved by history. HISTCONTROL does not exist by default on macOS,
  but can be set by the user and will be respected. Adversaries can use this to operate without
  leaving traces by simply prepending a space to all of their terminal commands.'
references: https://capec.mitre.org/data/definitions/13.html, http://cwe.mitre.org/data/definitions/353.html,
  http://cwe.mitre.org/data/definitions/15.html, http://cwe.mitre.org/data/definitions/74.html,
  http://cwe.mitre.org/data/definitions/302.html
prerequisites: An environment variable is accessible to the user.An environment variable used
  by the application can be tainted with user supplied data.Input data used in an environment
  variable is not validated properly.The variables encapsulation is not done properly. For
  instance setting a variable as public in a class makes it visible and an attacker may attempt
  to manipulate that variable.
