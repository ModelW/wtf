sid: AC12
title: Privilege Escalation
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.hasAccessControl is False or target.controls.implementsPOLP is
  False
severity: High
likelihood: null
details: An adversary exploits a weakness enabling them to elevate their privilege and perform
  an action that they are not supposed to be authorized to perform.
mitigations: Very carefully manage the setting, management, and handling of privileges. Explicitly
  manage trust zones in the software. Follow the principle of least privilege when assigning
  access rights to entities in a software system. Implement separation of privilege - Require
  multiple conditions to be met before permitting access to a system resource.
example: The software does not properly assign, modify, track, or check privileges for an
  actor, creating an unintended sphere of control for that actor. As a result, the program
  is indefinitely operating in a raised privilege state, possibly allowing further exploitation
  to occur.
