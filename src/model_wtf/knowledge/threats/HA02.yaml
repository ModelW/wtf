details: An attacker discovers the structure, function, and composition of a type of computer
  software through white box analysis techniques. White box techniques involve methods which
  can be applied to a piece of software when an executable or some other compiled object can
  be directly subjected to analysis, revealing at least a portion of its machine instructions
  that can be observed upon execution.
mitigations: Employ code obfuscation techniques to prevent the adversary from reverse engineering
  the targeted entity.
example: Attacker identifies client components to extract information from. These may be binary
  executables, class files, shared libraries (e.g., DLLs), configuration files, or other system
  files.
