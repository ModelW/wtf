sid: DS04
title: XSS Targeting Error Pages
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.encodesOutput is False or target.controls.validatesInput is False
  or target.controls.sanitizesInput is False
severity: Medium
likelihood: null
details: An adversary distributes a link (or possibly some other query structure) with a request
  to a third party web server that is malformed and also contains a block of exploit code
  in order to have the exploit become live code in the resulting error page. When the third
  party web server receives the crafted request and notes the error it then creates an error
  message that echoes the malformed message, including the exploit. Doing this converts the
  exploit portion of the message into to valid language elements that are executed by the
  viewing browser. When a victim executes the query provided by the attacker the infected
  error message error message is returned including the exploit code which then runs in the
  victim's browser. XSS can result in execution of code as well as data leakage (e.g. session
  cookies can be sent to the attacker). This type of attack is especially dangerous since
  the exploit appears to come from the third party web server, who the victim may trust and
  hence be more vulnerable to deception.
mitigations: 'Design: Use libraries and templates that minimize unfiltered input.Implementation:
  Normalize, filter and white list any input that will be used in error messages.Implementation:
  The victim should configure the browser to minimize active content from untrusted sources.'
example: A third party web server fails to adequately sanitize messages sent in error pages.
  Adversary takes advantage of the data displayed in the error message.
references: https://capec.mitre.org/data/definitions/198.html, http://cwe.mitre.org/data/definitions/81.html
prerequisites: A third party web server which fails to adequately sanitize messages sent in
  error pages.The victim must be made to execute a query crafted by the attacker which results
  in the infected error report.
