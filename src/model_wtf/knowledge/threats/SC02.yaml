sid: SC02
title: XSS Targeting Non-Script Elements
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False or target.controls.encodesOutput is False
severity: Very High
likelihood: null
details: This attack is a form of Cross-Site Scripting (XSS) where malicious scripts are embedded
  in elements that are not expected to host scripts such as image tags (<img>), comments in
  XML documents (< !-CDATA->), etc. These tags may not be subject to the same input validation,
  output validation, and other content filtering and checking routines, so this can create
  an opportunity for an attacker to tunnel through the application's elements and launch a
  XSS attack through other elements. As with all remote attacks, it is important to differentiate
  the ability to launch an attack (such as probing an internal network for unpatched servers)
  and the ability of the remote attacker to collect and interpret the output of said attack.
mitigations: In addition to the traditional input fields, all other user controllable inputs,
  such as image tags within messages or the likes, must also be subjected to input validation.
  Such validation should ensure that content that can be potentially interpreted as script
  by the browser is appropriately filtered.All output displayed to clients must be properly
  escaped. Escaping ensures that the browser interprets special scripting characters literally
  and not as script to be executed.
example: An online discussion forum allows its members to post HTML-enabled messages, which
  can also include image tags. A malicious user embeds JavaScript in the IMG tags in his messages
  that gets executed within the victim's browser whenever the victim reads these messages.
  <img src=javascript:alert('XSS')> When executed within the victim's browser, the malicious
  script could accomplish a number of adversary objectives including stealing sensitive information
  such as usernames, passwords, or cookies.
references: https://capec.mitre.org/data/definitions/18.html, http://cwe.mitre.org/data/definitions/80.html
prerequisites: The target client software must allow the execution of scripts generated by
  remote hosts.
