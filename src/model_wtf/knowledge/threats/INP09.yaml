sid: INP09
title: LDAP Injection
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False
severity: High
likelihood: null
details: An attacker manipulates or crafts an LDAP query for the purpose of undermining the
  security of the target. Some applications use user input to create LDAP queries that are
  processed by an LDAP server. For example, a user might provide their username during authentication
  and the username might be inserted in an LDAP query during the authentication process. An
  attacker could use this input to inject additional commands into an LDAP query that could
  disclose sensitive information. For example, entering a * in the aforementioned query might
  return information about all users on the system. This attack is very similar to an SQL
  injection attack in that it manipulates a query to gather additional information or coerce
  a particular return value.
mitigations: Strong input validation - All user-controllable input must be validated and filtered
  for illegal characters as well as LDAP content. Use of custom error pages - Attackers can
  glean information about the nature of queries from descriptive error messages. Input validation
  must be coupled with customized error pages that inform about an error without disclosing
  information about the LDAP or application.
example: PowerDNS before 2.9.18, when running with an LDAP backend, does not properly escape
  LDAP queries, which allows remote attackers to cause a denial of service (failure to answer
  ldap questions) and possibly conduct an LDAP injection attack.
references: https://capec.mitre.org/data/definitions/136.html, http://cwe.mitre.org/data/definitions/77.html,
  http://cwe.mitre.org/data/definitions/90.html, http://cwe.mitre.org/data/definitions/20.html
prerequisites: The target application must accept a string as user input, fail to sanitize
  characters that have a special meaning in LDAP queries in the user input, and insert the
  user-supplied string in an LDAP query which is then processed.
