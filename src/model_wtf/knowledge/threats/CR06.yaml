sid: CR06
title: Communication Channel Manipulation
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: (target.protocol != 'HTTPS' or target.usesVPN is False) and (target.controls.implementsAuthenticationScheme
  is False or target.controls.authorizesSource is False)
severity: High
likelihood: null
details: An adversary manipulates a setting or parameter on communications channel in order
  to compromise its security. This can result in information exposure, insertion/removal of
  information from the communications stream, and/or potentially system compromise.
mitigations: Encrypt all sensitive communications using properly-configured cryptography.Design
  the communication system such that it associates proper authentication/authorization with
  each channel/message.
example: Using MITM techniques, an attacker launches a blockwise chosen-boundary attack to
  obtain plaintext HTTP headers by taking advantage of an SSL session using an encryption
  protocol in CBC mode with chained initialization vectors (IV). This allows the attacker
  to recover session IDs, authentication cookies, and possibly other valuable data that can
  be used for further exploitation. Additionally this could allow for the insertion of data
  into the stream, allowing for additional attacks (CSRF, SQL inject, etc) to occur.
references: https://capec.mitre.org/data/definitions/216.html
prerequisites: The target application must leverage an open communications channel.The channel
  on which the target communicates must be vulnerable to interception (e.g., man in the middle
  attack).
