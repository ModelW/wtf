sid: DO05
title: XML Nested Payloads
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.usesXMLParser is True and (target.controls.validatesInput is False or target.controls.sanitizesInput
  is False)
severity: High
likelihood: null
details: Applications often need to transform data in and out of the XML format by using an
  XML parser. It may be possible for an attacker to inject data that may have an adverse effect
  on the XML parser when it is being processed. By nesting XML data and causing this data
  to be continuously self-referential, an attacker can cause the XML parser to consume more
  resources while processing, causing excessive memory consumption and CPU utilization. An
  attacker's goal is to leverage parser failure to his or her advantage. In most cases this
  type of an attack will result in a denial of service due to an application becoming unstable,
  freezing, or crash. However it may be possible to cause a crash resulting in arbitrary code
  execution, leading to a jump from the data plane to the control plane [R.230.1].
mitigations: Carefully validate and sanitize all user-controllable data prior to passing it
  to the XML parser routine. Ensure that the resultant data is safe to pass to the XML parser.Perform
  validation on canonical data.Pick a robust implementation of an XML parser.Validate XML
  against a valid schema or DTD prior to parsing.
example: An adversary crafts input data that may have an adverse effect on the operation of
  the XML parser when the data is parsed on the victim's system.
references: https://capec.mitre.org/data/definitions/230.html, http://cwe.mitre.org/data/definitions/112.html,
  http://cwe.mitre.org/data/definitions/770.html
prerequisites: An application uses an XML parser to perform transformation on user-controllable
  data.An application does not perform sufficient validation to ensure that user-controllable
  data is safe for an XML parser.
