# Dismissal rules: SIMPLE facts about an element, each decided from the
# introspected facts and a grep over the element's source files. No AST, no
# reasoning: if it takes judgement, it is not a rule, the cell stays open.
#
# Fields:
#   applies: [process|store|party|flow]
#   description: what the rule asserts when it fires
#   when: how it is decided
#     kind: [route|task|admin]          touchpoint kinds it fires on
#     scope: [subject|staff|public|system]
#     no_request: true                  fires when the touchpoint has no request
#                                       fields, no form fields, no params and
#                                       no unsafe HTTP method
#     methods_only: [GET, HEAD, OPTIONS]  fires when methods ⊆ this set
#     framework: [ninja, drf, ...]
#     id_absent: [<word>, ...]          fires when no word is a substring of the id
#     id_regex_absent: [<regex>, ...]   same, anchored regexes on the id
#     grep_absent: [<regex>, ...]       fires when none matches in the files
#     grep_present: [<regex>, ...]      fires when one matches
#     store_type: [database, ...]
#     flow: <predicate>                 personal | credentials
#   Several keys are ANDed. A rule with `kind` fires only for those kinds.

no_request:
  applies: [process]
  description: nothing from a request reaches this element (a task, a GET without parameters)
  when:
    no_request: true

no_raw_sql:
  applies: [process]
  description: the touchpoint's files only go through the ORM
  when:
    grep_absent: ['\.raw\(', 'RawSQL', 'cursor\(\)', '\.execute\(', 'extra\(\s*(select|where)']

no_xml:
  applies: [process, flow]
  description: no XML parser in the touchpoint's files
  when:
    grep_absent: ['xml\.etree', 'lxml', 'xml\.dom', 'xml\.sax', 'defusedxml', 'xmltodict', 'DOMParser', 'XMLParser', 'fast-xml-parser', 'xml2js']

no_soap:
  applies: [process]
  description: no SOAP client in the touchpoint's files
  when:
    grep_absent: ['\bzeep\b', '\bsuds\b', 'soap', 'SOAP', '\.wsdl', 'strong-soap', 'easy-soap']

no_llm:
  applies: [process]
  description: no LLM SDK, gateway, RAG stack, voice agent or provider API key in the touchpoint's files
  # What WITH's own repos use (Sept 2026): the ChatFAQ SDK and its FSMs
  # (cawl-chatbot, lefebvre-xia, bonnard, activeseed, enel), OpenAI /
  # Anthropic / Mistral / Google GenAI / Together, LiveKit voice agents with
  # ElevenLabs / Deepgram / Speechmatics, chat_rag / rag_pipeline over
  # pgvector, Laminar and OpenInference tracing, the rhllor gateway and
  # OpenRouter. Lockfiles are never read (litellm is transitive everywhere):
  # only the element's own files count. Common English words (together,
  # whisper, phoenix) are matched only as imports or package names.
  when:
    grep_absent:
      # SDKs and frameworks
      - '\bchatfaq(_sdk|-sdk|-widget)?\b'
      - 'ChatFAQSDK|FSMDefinition'
      - '(import|from)\s+(openai|anthropic|mistralai|together|cohere|groq|replicate|dspy|haystack|instructor|silero|whisper)\b'
      - 'api\.(openai|anthropic|mistral|together|cohere|groq)\.(com|ai|xyz)'
      - 'google\.genai|google-genai|generativeai|generativelanguage\.googleapis'
      - 'bedrock-runtime|invoke_model\('
      - 'langchain|langgraph|llama_index|llamaindex|litellm|\bollama\b|pydantic_ai'
      - '\btransformers\b|sentence_transformers|\bvllm\b'
      - "@ai-sdk|from ['\"]ai['\"]"
      # voice agents
      - '\blivekit\b|elevenlabs|deepgram|speechmatics'
      # RAG
      - '\bchat_rag\b|\brag_pipeline\b|embedding_provider|VectorField|\bpgvector\b|\bqdrant\b|\bchromadb\b|\bweaviate\b|\bpinecone\b|\bfaiss\b'
      # observability wrappers only used around LLM calls
      - '\blmnr\b|openinference|langfuse'
      # endpoints and gateways
      - 'chat\.completions|/v1/messages|/v1/chat|/v1/embeddings|openrouter|\brhllor\b'
      # provider keys
      - '(OPENAI|ANTHROPIC|MISTRAL|OPENROUTER|GEMINI|GOOGLE_AI|GOOGLE_GENAI|COHERE|HUGGINGFACE|HF|TOGETHER|GROQ|ELEVENLABS|DEEPGRAM|LIVEKIT|CHATFAQ|LMNR|LANGFUSE)_(API_)?(KEY|TOKEN|SECRET)'

not_surface_route:
  applies: [process]
  description: not a discovery endpoint (API docs, schema, admin index, browsable API)
  when:
    id_regex_absent: ['(^|[:/_-])(docs|openapi|schema|swagger|redoc|browsable|api-root|debug)([:/_-]|$)', 'admin:index$']

no_resource_from_input:
  applies: [process]
  description: no file path, URL or bucket key is built in the touchpoint's files
  when:
    grep_absent: ['open\(', 'Path\(', 'os\.path\.join', 'urlopen', 'httpx\.', 'requests\.', 'fetch\(', 'storage\.(open|save|url)', 'default_storage', 'readFile', 'writeFile']

no_path_from_input:
  applies: [process]
  description: no filesystem access in the touchpoint's files
  when:
    grep_absent: ['open\(', 'Path\(', 'os\.path', 'send_file', 'FileResponse', 'sendfile', 'readFile', 'createReadStream']

no_file_input:
  applies: [process]
  description: the touchpoint neither receives nor serves files
  when:
    grep_absent: ['UploadedFile', 'FILES', 'FileField', 'ImageField', 'FileResponse', 'File\(', 'formData\.get\(', 'multipart', 'Blob']
    no_file_request: true

no_dynamic_code:
  applies: [process]
  description: no eval/exec/dynamic import in the touchpoint's files
  when:
    grep_absent: ['\beval\(', '\bexec\(', 'import_module\(', '__import__', 'compile\(', 'new Function\(', 'import\(\s*[a-zA-Z_$]']

no_shell:
  applies: [process]
  description: no subprocess/shell in the touchpoint's files
  when:
    grep_absent: ['subprocess', 'os\.system', 'os\.popen', 'child_process', 'execSync', 'spawn\(']

no_html_output:
  applies: [process]
  description: the touchpoint returns JSON/bytes, not HTML (ninja/drf routes, tasks)
  when:
    framework: [ninja, drf, procrastinate, celery]

no_unsafe_html:
  applies: [process]
  description: no bypass of template auto-escaping in the touchpoint's files
  when:
    grep_absent: ['mark_safe', '\|\s*safe\b', 'format_html', 'SafeString', 'autoescape off', '\{@html', 'innerHTML', 'dangerouslySetInnerHTML', 'v-html']

no_json_get_with_session:
  applies: [process]
  description: not a cookie-authenticated GET returning JSON
  when:
    any_of:
      - methods_exclude: [GET]
      - framework_not: [ninja, drf]
      - auth_not_cookie: true

public_by_design:
  applies: [process]
  description: the touchpoint is meant for anyone (catalogue, signup, login, health); authentication and ownership do not apply
  when:
    scope: [public]

not_login:
  applies: [process]
  description: not a login / token-issuing touchpoint
  when:
    id_absent: ['login', 'signin', 'sign-in', 'token', 'auth', 'password', 'otp', 'magic']

not_debug_route:
  applies: [process]
  description: not a test/demo/debug route
  when:
    id_absent: ['debug', 'test', 'demo', 'sample', 'playground', 'sandbox', '__']

no_cookie_auth:
  applies: [process]
  description: not authenticated by a cookie (bearer tokens are not sent cross-site)
  when:
    auth_not_cookie: true

safe_method_only:
  applies: [process]
  description: only safe HTTP methods (no state change to forge)
  when:
    methods_only: [GET, HEAD, OPTIONS]

no_ids_from_input:
  applies: [process]
  description: no resource identifier comes from the request (no path params, no *_id field)
  when:
    no_ids: true

no_cache_use:
  applies: [process]
  description: the touchpoint does not read or write the cache itself
  when:
    grep_absent: ['cache\.(get|set|get_or_set|add)\(', 'cache_page', 'cached_property', '@cache', 'lru_cache', 'redis\.']

store_not_shared:
  applies: [store]
  description: the store belongs to a single unit (no other unit's data item lives in it)
  when:
    store_single_unit: true

store_not_audit:
  applies: [store]
  description: the store holds no audit-trail model (LogEntry, Revision, *Change, *History)
  when:
    store_no_audit_models: true

flow_not_personal:
  applies: [flow]
  description: the flow carries no personal item
  when:
    flow: not_personal

flow_no_credentials:
  applies: [flow]
  description: the flow carries no item of category `credentials`
  when:
    flow: no_credentials

declared_transfer:
  applies: [flow]
  description: the flow is a declared transfer to a party with a valid Ch. V safeguard; sending the data there is the intended use, not a leak (whether it sends more than declared is the reviewer's question at declaration time)
  when:
    flow: declared_transfer
