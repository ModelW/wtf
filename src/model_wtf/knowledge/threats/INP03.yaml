sid: INP03
title: Server Side Include (SSI) Injection
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.sanitizesInput is False or target.controls.encodesOutput is False
severity: High
likelihood: null
details: An attacker can use Server Side Include (SSI) Injection to send code to a web application
  that then gets executed by the web server. Doing so enables the attacker to achieve similar
  results to Cross Site Scripting, viz., arbitrary code execution and information disclosure,
  albeit on a more limited scale, since the SSI directives are nowhere near as powerful as
  a full-fledged scripting language. Nonetheless, the attacker can conveniently gain access
  to sensitive files, such as password files, and execute shell commands.
mitigations: Set the OPTIONS IncludesNOEXEC in the global access.conf file or local .htaccess
  (Apache) file to deny SSI execution in directories that do not need them. All user controllable
  input must be appropriately sanitized before use in the application. This includes omitting,
  or encoding, certain characters or strings that have the potential of being interpreted
  as part of an SSI directive. Server Side Includes must be enabled only if there is a strong
  business reason to do so. Every additional component enabled on the web server increases
  the attack surface as well as administrative overhead.
example: Consider a website hosted on a server that permits Server Side Includes (SSI), such
  as Apache with the Options Includes directive enabled. Whenever an error occurs, the HTTP
  Headers along with the entire request are logged, which can then be displayed on a page
  that allows review of such errors. A malicious user can inject SSI directives in the HTTP
  Headers of a request designed to create an error. When these logs are eventually reviewed,
  the server parses the SSI directives and executes them.
references: https://capec.mitre.org/data/definitions/101.html, http://cwe.mitre.org/data/definitions/97.html,
  http://cwe.mitre.org/data/definitions/74.html, http://cwe.mitre.org/data/definitions/20.html,
  http://cwe.mitre.org/data/definitions/713.html
prerequisites: A web server that supports server side includes and has them enabledUser controllable
  input that can carry include directives to the web server
