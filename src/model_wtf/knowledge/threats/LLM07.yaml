details: An attacker uses adversarial prompting techniques to bypass the LLM's safety guidelines
  and system prompt restrictions. Without content filtering, the system prompt alone is insufficient
  to prevent jailbreaking, as attackers can use techniques like role-playing, encoding tricks,
  or multi-turn manipulation to circumvent behavioral constraints.
mitigations: Implement layered defense with both system prompts and content filtering. Use
  output filtering to detect and block policy-violating responses. Regularly test with adversarial
  prompts and update defenses. Consider using classifier models to detect jailbreaking attempts.
