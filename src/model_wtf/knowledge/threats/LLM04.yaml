sid: LLM04
title: Training Data Poisoning
source: pytm v1.4.0
pytm_targets:
- LLM
elements: []
condition: target.hasFineTuning is True and target.controls.providesIntegrity is False
severity: High
likelihood: null
details: When a fine-tuned model's training data lacks integrity controls, an attacker may
  inject malicious or biased data into the training pipeline. This can cause the model to
  produce incorrect, biased, or harmful outputs, or to include backdoors that activate on
  specific inputs.
mitigations: Validate and sanitize all training data. Implement provenance tracking for training
  datasets. Use checksums or digital signatures to verify data integrity. Perform adversarial
  testing on fine-tuned models. Restrict access to training pipelines.
example: An attacker with access to a shared training data repository injects subtly modified
  examples that cause the fine-tuned model to produce incorrect medical advice when prompted
  with specific symptom patterns.
references: https://owasp.org/www-project-top-10-for-large-language-model-applications/, https://genai.owasp.org/llmrisk/llm03-training-data-poisoning/
prerequisites: The model uses fine-tuning with custom training data. Training data integrity
  is not verified or protected.
