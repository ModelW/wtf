sid: INP08
title: Format String Injection
source: pytm v1.4.0
pytm_targets:
- Lambda
- Process
- Server
elements:
- process
condition: target.controls.validatesInput is False or target.controls.sanitizesInput is False
severity: High
likelihood: null
details: An adversary includes formatting characters in a string input field on the target
  application. Most applications assume that users will provide static text and may respond
  unpredictably to the presence of formatting character. For example, in certain functions
  of the C programming languages such as printf, the formatting character %s will print the
  contents of a memory location expecting this location to identify a string and the formatting
  character %n prints the number of DWORD written in the memory. An adversary can use this
  to read or write to memory locations or files, or simply to manipulate the value of the
  resulting text in unexpected ways. Reading or writing memory may result in program crashes
  and writing memory could result in the execution of arbitrary code if the adversary can
  write to the program stack.
mitigations: Limit the usage of formatting string functions. Strong input validation - All
  user-controllable input must be validated and filtered for illegal formatting characters.
example: Untrusted search path vulnerability in the add_filename_to_string function in intl/gettext/loadmsgcat.c
  for Elinks 0.11.1 allows local users to cause Elinks to use an untrusted gettext message
  catalog (.po file) in a ../po directory, which can be leveraged to conduct format string
  attacks.
references: https://capec.mitre.org/data/definitions/135.html, http://cwe.mitre.org/data/definitions/134.html,
  http://cwe.mitre.org/data/definitions/133.html
prerequisites: The target application must accept a strings as user input, fail to sanitize
  string formatting characters in the user input, and process this string using functions
  that interpret string formatting characters.
