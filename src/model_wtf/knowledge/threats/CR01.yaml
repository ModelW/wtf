sid: CR01
title: Session Sidejacking
source: pytm v1.4.0
pytm_targets:
- Dataflow
- Server
elements:
- flow
- process
condition: (target.protocol == 'HTTP' or target.usesVPN is False) and target.usesSessionTokens
  is True
severity: High
likelihood: null
details: Session sidejacking takes advantage of an unencrypted communication channel between
  a victim and target system. The attacker sniffs traffic on a network looking for session
  tokens in unencrypted traffic. Once a session token is captured, the attacker performs malicious
  actions by using the stolen token with the targeted application to impersonate the victim.
  This attack is a specific method of session hijacking, which is exploiting a valid session
  token to gain unauthorized access to a target system or information. Other methods to perform
  a session hijacking are session fixation, cross-site scripting, or compromising a user or
  server machine and stealing the session token.
mitigations: Make sure that HTTPS is used to communicate with the target system. Alternatively,
  use VPN if possible. It is important to ensure that all communication between the client
  and the server happens via an encrypted secure channel. Modify the session token with each
  transmission and protect it with cryptography. Add the idea of request sequencing that gives
  the server an ability to detect replay attacks.
example: The attacker and the victim are using the same WiFi public hotspot. When the victim
  connects to the hotspot, he has a hosted e-mail account open. This e-mail account uses AJAX
  on the client side which periodically asynchronously connects to the server side and transfers,
  amongst other things, the user's session token to the server. The communication is supposed
  to happen over HTTPS. However, the configuration in the public hotspot initially disallows
  the HTTPS connection (or any other connection) between the victim and the hosted e-mail
  servers because the victim first needs to register with the hotspot. The victim does so,
  but his e-mail client already defaulted to using a connection without HTTPS, since it was
  denied access the first time. Victim's session token is now flowing unencrypted between
  the victim's browser and the hosted e-mail servers. The attacker leverages this opportunity
  to capture the session token and gain access to the victim's hosted e-mail account.
references: https://capec.mitre.org/data/definitions/102.html, http://cwe.mitre.org/data/definitions/294.html,
