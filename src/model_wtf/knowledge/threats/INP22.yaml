sid: INP22
title: XML Attribute Blowup
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.usesXMLParser is False or target.controls.disablesDTD is False
severity: High
likelihood: null
details: This attack exploits certain XML parsers which manage data in an inefficient manner.
  The attacker crafts an XML document with many attributes in the same XML node. In a vulnerable
  parser, this results in a denial of service condition owhere CPU resources are exhausted
  because of the parsing algorithm.
mitigations: This attack may be mitigated completely by using a parser that is not using a
  vulnerable container. Mitigation may also limit the number of attributes per XML element.
example: In this example, assume that the victim is running a vulnerable parser such as .NET
  framework 1.0. This results in a quadratic runtime of O(n^2). <?xml version=1.0?><fooaaa=ZZZ=...999=/>
  A document with n attributes results in (n^2)/2 operations to be performed. If an operation
  takes 100 nanoseconds then a document with 100,000 operations would take 500s to process.
  In this fashion a small message of less than 1MB causes a denial of service condition on
  the CPU resources.
references: https://capec.mitre.org/data/definitions/229.html, http://cwe.mitre.org/data/definitions/770.html
prerequisites: The server accepts XML input and is using a parser with a runtime longer than
  O(n) for the insertion of a new attribute in the data container.(examples are .NET framework
  1.0 and 1.1)
