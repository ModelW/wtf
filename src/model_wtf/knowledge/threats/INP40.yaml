sid: INP40
title: Stored XSS
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.allowsClientSideScripting is True and (target.controls.sanitizesInput is
  False or target.controls.validatesInput is False)
severity: Very High
likelihood: null
details: This type of attack is a form of Cross-site Scripting (XSS) where a malicious script
  is persistenly “stored” within the data storage of a vulnerable web application. Initially
  presented by an adversary to the vulnerable web application, the malicious script is incorrectly
  considered valid input and is not properly encoded by the web application. A victim is then
  convinced to use the web application in a way that creates a response that includes the
  malicious script. This response is subsequently sent to the victim and the malicious script
  is executed by the victim's browser. To launch a successful Stored XSS attack, an adversary
  looks for places where stored input data is used in the generation of a response. This often
  involves elements that are not expected to host scripts such as image tags (<img>), or the
  addition of event attibutes such as onload and onmouseover. These elements are often not
  subject to the same input validation, output encoding, and other content filtering and checking
  routines.
mitigations: Use browser technologies that do not allow client-side scripting.Utilize strict
  type, character, and encoding enforcement.Ensure that all user-supplied input is validated
  before being stored.
example: An adversary determines that a system uses a web based interface for administration.
  The adversary creates a new user record and supplies a malicious script in the user name
  field. The user name field is not validated by the system and a new log entry is created
  detailing the creation of the new user. Later, an administrator reviews the log in the administrative
  console. When the administrator comes across the new user entry, the browser sees a script
  and executes it, stealing the administrator's authentication cookie and forwarding it to
  the adversary. An adversary then uses the received authentication cookie to log in to the
  system as an administrator, provided that the administrator console can be accessed remotely.An
  online discussion forum allows its members to post HTML-enabled messages, which can also
  include image tags. An adversary embeds JavaScript in the image tags of his message. The
  adversary then sends the victim an email advertising free goods and provides a link to the
  form for how to collect. When the victim visits the forum and reads the message, the malicious
  script is executed within the victim's browser.
references: https://capec.mitre.org/data/definitions/592.html
prerequisites: An application that leverages a client-side web browser with scripting enabled.An
  application that fails to adequately sanitize or encode untrusted input.An application that
  stores information provided by the user in data storage of some kind.
