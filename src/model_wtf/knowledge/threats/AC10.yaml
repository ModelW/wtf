sid: AC10
title: Exploiting Incorrectly Configured SSL
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.checkTLSVersion(target.inputs) and (not target.controls.implementsAuthenticationScheme
  or not target.controls.authorizesSource)
severity: High
likelihood: null
details: An adversary takes advantage of incorrectly configured SSL communications that enables
  access to data intended to be encrypted. The adversary may also use this type of attack
  to inject commands or other traffic into the encrypted stream to cause compromise of either
  the client or server.
mitigations: Usage of configuration settings, such as stream ciphers vs. block ciphers and
  setting timeouts on SSL sessions to extremely low values lessens the potential impact. Use
  of later versions of TLS (e.g. TLS 1.1+) can also be effective, but not all clients or servers
  support the later versions.
example: Using MITM techniques, an attacker launches a blockwise chosen-boundary attack to
  obtain plaintext HTTP headers by taking advantage of an SSL session using an encryption
  protocol in CBC mode with chained initialization vectors (IV). This allows the attacker
  to recover session IDs, authentication cookies, and possibly other valuable data that can
  be used for further exploitation. Additionally this could allow for the insertion of data
  into the stream, allowing for additional attacks (CSRF, SQL inject, etc) to occur.
references: https://capec.mitre.org/data/definitions/217.html, http://cwe.mitre.org/data/definitions/201.html
prerequisites: Access to the client/server stream.
