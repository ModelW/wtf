sid: LLM03
title: Sensitive Data Leakage to Third-Party Provider
source: pytm v1.4.0
pytm_targets:
- LLM
elements: []
condition: target.isThirdParty is True and target.processesPersonalData is True and target.controls.providesConfidentiality
  is False
severity: High
likelihood: null
details: When a third-party LLM API processes personal or sensitive data without adequate
  confidentiality controls, there is a risk that the data is exposed to the third-party provider.
  The provider may log, store, or use the data for training purposes, leading to potential
  regulatory violations and data breaches.
mitigations: Implement data masking or anonymization before sending data to the LLM. Use contractual
  agreements (DPAs) with the provider. Enable opt-out of data retention and training where
  available. Consider self-hosted alternatives for sensitive workloads. Encrypt data in transit.
example: A healthcare application sends patient records to a third-party LLM API for summarization.
  The provider logs all API requests for debugging purposes, inadvertently storing protected
  health information (PHI) in violation of HIPAA.
references: https://owasp.org/www-project-top-10-for-large-language-model-applications/, https://genai.owasp.org/llmrisk/llm06-sensitive-information-disclosure/
prerequisites: The LLM is accessed via a third-party API. Personal or sensitive data is sent
  to the LLM. No confidentiality controls (e.g., encryption, data masking, contractual guarantees)
  are in place.
