sid: INP17
title: XSS Using MIME Type Mismatch
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesContentType is False or target.controls.invokesScriptFilters
  is False
severity: Medium
likelihood: null
details: An adversary creates a file with scripting content but where the specified MIME type
  of the file is such that scripting is not expected. The adversary tricks the victim into
  accessing a URL that responds with the script file. Some browsers will detect that the specified
  MIME type of the file does not match the actual type of its content and will automatically
  switch to using an interpreter for the real content type. If the browser does not invoke
  script filters before doing this, the adversary's script may run on the target unsanitized,
  possibly revealing the victim's cookies or executing arbitrary script in their browser.
mitigations: 'Design: Browsers must invoke script filters to detect that the specified MIME
  type of the file matches the actual type of its content before deciding which script interpreter
  to use.'
example: For example, the MIME type text/plain may be used where the actual content is text/javascript
  or text/html. Since text does not contain scripting instructions, the stated MIME type would
  indicate that filtering is unnecessary. However, if the target application subsequently
  determines the file's real type and invokes the appropriate interpreter, scripted content
  could be invoked.In another example, img tags in HTML content could reference a renderable
  type file instead of an expected image file. The file extension and MIME type can describe
  an image file, but the file content can be text/javascript or text/html resulting in script
  execution. If the browser assumes all references in img tags are images, and therefore do
  not need to be filtered for scripts, this would bypass content filters.
references: http://cwe.mitre.org/data/definitions/79.html, http://cwe.mitre.org/data/definitions/20.html,
  http://cwe.mitre.org/data/definitions/646.html
prerequisites: The victim must follow a crafted link that references a scripting file that
  is mis-typed as a non-executable file.The victim's browser must detect the true type of
  a mis-labeled scripting file and invoke the appropriate script interpreter without first
  performing filtering on the content.
