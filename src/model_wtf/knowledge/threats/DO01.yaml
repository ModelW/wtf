sid: DO01
title: Flooding
source: pytm v1.4.0
pytm_targets:
- Process
- Server
elements:
- process
condition: target.controls.handlesResourceConsumption is False or target.controls.isResilient
  is False
severity: Medium
likelihood: null
details: An adversary consumes the resources of a target by rapidly engaging in a large number
  of interactions with the target. This type of attack generally exposes a weakness in rate
  limiting or flow. When successful this attack prevents legitimate users from accessing the
  service and can cause the target to crash. This attack differs from resource depletion through
  leaks or allocations in that the latter attacks do not rely on the volume of requests made
  to the target but instead focus on manipulation of the target's operations. The key factor
  in a flooding attack is the number of requests the adversary can make in a given period
  of time. The greater this number, the more likely an attack is to succeed against a given
  target.
mitigations: Ensure that protocols have specific limits of scale configured. Specify expectations
  for capabilities and dictate which behaviors are acceptable when resource allocation reaches
  limits. Uniformly throttle all requests in order to make it more difficult to consume resources
  more quickly than they can again be freed.
example: Adversary tries to bring a network or service down by flooding it with large amounts
  of traffic.
references: https://capec.mitre.org/data/definitions/125.html, http://cwe.mitre.org/data/definitions/404.html,
  http://cwe.mitre.org/data/definitions/770.html
prerequisites: Any target that services requests is vulnerable to this attack on some level
  of scale.
