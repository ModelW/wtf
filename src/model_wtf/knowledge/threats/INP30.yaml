sid: INP30
title: XSS Using Invalid Characters
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.validatesInput is False or target.controls.sanitizesInput is False
severity: Medium
likelihood: null
details: An adversary inserts invalid characters in identifiers to bypass application filtering
  of input. Filters may not scan beyond invalid characters but during later stages of processing
  content that follows these invalid characters may still be processed. This allows the attacker
  to sneak prohibited commands past filters and perform normally prohibited operations. Invalid
  characters may include null, carriage return, line feed or tab in an identifier. Successful
  bypassing of the filter can result in a XSS attack, resulting in the disclosure of web cookies
  or possibly other results.
mitigations: 'Design: Use libraries and templates that minimize unfiltered input.Implementation:
  Normalize, filter and white list any input that will be included in any subsequent web pages
  or back end operations.Implementation: The victim should configure the browser to minimize
  active content from untrusted sources.'
example: The software may attempt to remove a 'javascript:' URI scheme, but a 'java%00script:'
  URI may bypass this check and still be rendered as active javascript by some browsers, allowing
  XSS or other attacks.
references: https://capec.mitre.org/data/definitions/247.html, https://cwe.mitre.org/data/definitions/86.html
prerequisites: The target must fail to remove invalid characters from input and fail to adequately
  scan beyond these characters.
