sid: AC05
title: Content Spoofing
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: ((not target.source.controls.providesIntegrity or not target.sink.controls.providesIntegrity)
  and not target.controls.isEncrypted) or (target.source.inScope and not target.isResponse
  and (not target.controls.authenticatesDestination or not target.controls.checksDestinationRevocation))
severity: Medium
likelihood: null
details: An adversary modifies content to make it contain something other than what the original
  content producer intended while keeping the apparent source of the content unchanged. The
  term content spoofing is most often used to describe modification of web pages hosted by
  a target to display the adversary's content instead of the owner's content. However, any
  content can be spoofed, including the content of email messages, file transfers, or the
  content of other network communication protocols. Content can be modified at the source
  (e.g. modifying the source file for a web page) or in transit (e.g. intercepting and modifying
  a message between the sender and recipient). Usually, the adversary will attempt to hide
  the fact that the content has been modified, but in some cases, such as with web site defacement,
  this is not necessary. Content Spoofing can lead to malware exposure, financial fraud (if
  the content governs financial transactions), privacy violations, and other unwanted outcomes.
mitigations: Validation of user input for type, length, data-range, format, etc. Encoding
  any user input that will be output by the web application.
example: An attacker finds a site which is vulnerable to HTML Injection. He sends a URL with
  malicious code injected in the URL to the user of the website(victim) via email or some
  other social networking site. User visits the page because the page is located within trusted
  domain. When the victim accesses the page, the injected HTML code is rendered and presented
  to the user asking for username and password. The username and password are both sent to
  the attacker's server.
references: https://capec.mitre.org/data/definitions/148.html, http://cwe.mitre.org/data/definitions/345.html,
  https://cwe.mitre.org/data/definitions/299.html
prerequisites: The target must provide content but fail to adequately protect it against modification.The
  adversary must have the means to alter data to which he/she is not authorized.If the content
  is to be modified in transit, the adversary must be able to intercept the targeted messages.
