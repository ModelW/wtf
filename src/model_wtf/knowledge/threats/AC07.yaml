sid: AC07
title: Exploiting Incorrectly Configured Access Control Security Levels
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.hasAccessControl is False
severity: Medium
likelihood: null
details: An attacker exploits a weakness in the configuration of access controls and is able
  to bypass the intended protection that these measures guard against and thereby obtain unauthorized
  access to the system or network. Sensitive functionality should always be protected with
  access controls. However configuring all but the most trivial access control systems can
  be very complicated and there are many opportunities for mistakes. If an attacker can learn
  of incorrectly configured access security settings, they may be able to exploit this in
  an attack. Most commonly, attackers would take advantage of controls that provided too little
  protection for sensitive activities in order to perform actions that should be denied to
  them. In some circumstances, an attacker may be able to take advantage of overly restrictive
  access control policies, initiating denial of services (if an application locks because
  it unexpectedly failed to be granted access) or causing other legitimate actions to fail
  due to security. The latter class of attacks, however, is usually less severe and easier
  to detect than attacks based on inadequate security restrictions. This attack pattern differs
  from CAPEC 1, Accessing Functionality Not Properly Constrained by ACLs in that the latter
  describes attacks where sensitive functionality lacks access controls, where, in this pattern,
  the access control is present, but incorrectly configured.
mitigations: 'Design: Configure the access control correctly.'
example: For example, an incorrectly configured Web server, may allow unauthorized access
  to it, thus threaten the security of the Web application.
references: https://capec.mitre.org/data/definitions/180.html, http://cwe.mitre.org/data/definitions/732.html
prerequisites: The target must apply access controls, but incorrectly configure them. However,
  not all incorrect configurations can be exploited by an attacker. If the incorrect configuration
  applies too little security to some functionality, then the attacker may be able to exploit
  it if the access control would be the only thing preventing an attacker's access and it
  no longer does so. If the incorrect configuration applies too much security, it must prevent
  legitimate activity and the attacker must be able to force others to require this activity.
