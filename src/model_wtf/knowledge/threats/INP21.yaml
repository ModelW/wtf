sid: INP21
title: DTD Injection
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.usesXMLParser is False or target.controls.disablesDTD is False
severity: Medium
likelihood: null
details: An attacker injects malicious content into an application's DTD in an attempt to
  produce a negative technical impact. DTDs are used to describe how XML documents are processed.
  Certain malformed DTDs (for example, those with excessive entity expansion as described
  in CAPEC 197) can cause the XML parsers that process the DTDs to consume excessive resources
  resulting in resource depletion.
mitigations: 'Design: Sanitize incoming DTDs to prevent excessive expansion or other actions
  that could result in impacts like resource depletion.Implementation: Disallow the inclusion
  of DTDs as part of incoming messages.Implementation: Use XML parsing tools that protect
  against DTD attacks.'
example: Adversary injects XML External Entity (XEE) attack that can cause the disclosure
  of confidential information, execute abitrary code, create a Denial of Service of the targeted
  server, or several other malicious impacts.
references: https://capec.mitre.org/data/definitions/228.html, http://cwe.mitre.org/data/definitions/829.html
prerequisites: The target must be running an XML based application that leverages DTDs.
