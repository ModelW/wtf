sid: DE01
title: Interception
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: not target.controls.isEncrypted or (target.source.inScope and not target.isResponse
  and (not target.controls.authenticatesDestination or not target.controls.checksDestinationRevocation))
  or target.tlsVersion < target.sink.minTLSVersion
severity: Medium
likelihood: null
details: An adversary monitors data streams to or from the target for information gathering
  purposes. This attack may be undertaken to solely gather sensitive information or to support
  a further attack against the target. This attack pattern can involve sniffing network traffic
  as well as other types of data streams (e.g. radio). The adversary can attempt to initiate
  the establishment of a data stream, influence the nature of the data transmitted, or passively
  observe the communications as they unfold. In all variants of this attack, the adversary
  is not the intended recipient of the data stream. In contrast to other means of gathering
  information (e.g., targeting data leaks), the adversary must actively position himself so
  as to observe explicit data channels (e.g. network traffic) and read the content.
mitigations: Leverage encryption to encode the transmission of data thus making it accessible
  only to authorized parties.
example: Adversary tries to block, manipulate, and steal communications in an attempt to achieve
  a desired negative technical impact.
references: https://capec.mitre.org/data/definitions/117.html, http://cwe.mitre.org/data/definitions/319.html,
  https://cwe.mitre.org/data/definitions/299.html
prerequisites: The target must transmit data over a medium that is accessible to the adversary.
