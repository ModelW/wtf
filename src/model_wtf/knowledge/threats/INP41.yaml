sid: INP41
title: Argument Injection
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.validatesInput is False or target.controls.sanitizesInput is False
severity: High
likelihood: null
details: An attacker changes the behavior or state of a targeted application through injecting
  data or command syntax through the targets use of non-validated and non-filtered arguments
  of exposed services or methods.
mitigations: 'Design: Do not program input values directly on command shell, instead treat
  user input as guilty until proven innocent. Build a function that takes user input and converts
  it to applications specific types and values, stripping or filtering out all unauthorized
  commands and characters in the process.Design: Limit program privileges, so if metacharacters
  or other methods circumvent program input validation routines and shell access is attained
  then it is not running under a privileged account. chroot jails create a sandbox for the
  application to execute in, making it more difficult for an attacker to elevate privilege
  even in the case that a compromise has occurred.Implementation: Implement an audit log that
  is written to a separate host, in the event of a compromise the audit log may be able to
  provide evidence and details of the compromise.'
example: A recent example instance of argument injection occurred against Java Web Start technology,
  which eases the client side deployment for Java programs. The JNLP files that are used to
  describe the properties for the program. The client side Java runtime used the arguments
  in the property setting to define execution parameters, but if the attacker appends commands
  to an otherwise legitimate property file, then these commands are sent to the client command
  shell. [R.6.2]
references: https://capec.mitre.org/data/definitions/6.html
prerequisites: Target software fails to strip all user-supplied input of any content that
  could cause the shell to perform unexpected actions.Software must allow for unvalidated
  or unfiltered input to be executed on operating system shell, and, optionally, the system
  configuration must allow for output to be sent back to client.
