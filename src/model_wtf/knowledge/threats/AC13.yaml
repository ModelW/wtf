sid: AC13
title: Hijacking a privileged process
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.hasAccessControl is False or target.controls.implementsPOLP is
  False
severity: Medium
likelihood: null
details: An attacker gains control of a process that is assigned elevated privileges in order
  to execute arbitrary code with those privileges. Some processes are assigned elevated privileges
  on an operating system, usually through association with a particular user, group, or role.
  If an attacker can hijack this process, they will be able to assume its level of privilege
  in order to execute their own code. Processes can be hijacked through improper handling
  of user input (for example, a buffer overflow or certain types of injection attacks) or
  by utilizing system utilities that support process control that have been inadequately secured.
mitigations: Very carefully manage the setting, management, and handling of privileges. Explicitly
  manage trust zones in the software. Follow the principle of least privilege when assigning
  access rights to entities in a software system. Implement separation of privilege - Require
  multiple conditions to be met before permitting access to a system resource.
example: The software does not properly assign, modify, track, or check privileges for an
  actor, creating an unintended sphere of control for that actor. As a result, the program
  is indefinitely operating in a raised privilege state, possibly allowing further exploitation
  to occur.
references: https://capec.mitre.org/data/definitions/234.html, http://cwe.mitre.org/data/definitions/732.html,
  http://cwe.mitre.org/data/definitions/648.html
prerequisites: The targeted process or operating system must contain a bug that allows attackers
  to hijack the targeted process.
