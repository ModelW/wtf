sid: DR01
title: Unprotected Sensitive Data
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: (target.hasDataLeaks() or any(d.isCredentials or d.isPII for d in target.data))
  and (not target.controls.isEncrypted or (not target.isResponse and any(d.isStored and d.isDestEncryptedAtRest
  for d in target.data)) or (target.isResponse and any(d.isStored and d.isSourceEncryptedAtRest
  for d in target.data)))
severity: High
likelihood: null
details: An attacker can access data in transit or at rest that is not sufficiently protected.
  If an attacker can decrypt a stored password, it might be used to authenticate against different
  services.
mitigations: All data should be encrypted in transit. All PII and restricted data must be
  encrypted at rest. If a service is storing credentials used to authenticate users or incoming
  connections, it must only store hashes of them created using cryptographic functions, so
  it is only possible to compare them against user input, without fully decoding them. If
  a client is storing credentials in either files or other data store, access to them must
  be as restrictive as possible, including using proper file permissions, database users with
  restricted access or separate storage.
