sid: INP31
title: Command Injection
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.usesParameterizedInput is False and (target.controls.validatesInput
  is False or target.controls.sanitizesInput is False)
severity: High
likelihood: null
details: An adversary looking to execute a command of their choosing, injects new items into
  an existing command thus modifying interpretation away from what was intended. Commands
  in this context are often standalone strings that are interpreted by a downstream component
  and cause specific responses. This type of attack is possible when untrusted values are
  used to build these command strings. Weaknesses in input validation or command construction
  can enable the attack and lead to successful exploitation.
mitigations: All user-controllable input should be validated and filtered for potentially
  unwanted characters. Whitelisting input is desired, but if a blacklisting approach is necessary,
  then focusing on command related terms and delimiters is necessary.Input should be encoded
  prior to use in commands to make sure command related characters are not treated as part
  of the command. For example, quotation characters may need to be encoded so that the application
  does not treat the quotation as a delimiter.Input should be parameterized, or restricted
  to data sections of a command, thus removing the chance that the input will be treated as
  part of the command itself.
example: Consider a URL 'http://sensitive/cgi-bin/userData.pl?doc=user1.txt'. If the URL is
  modified like so - 'http://sensitive/cgi-bin/userData.pl?doc=/bin/ls|', it executed the
  command '/bin/ls|'. This is how command injection is implemented.
references: https://capec.mitre.org/data/definitions/248.html
prerequisites: The target application must accept input from the user and then use this input
  in the construction of commands to be executed. In virtually all cases, this is some form
  of string input that is concatenated to a constant string defined by the application to
  form the full command to be executed.
