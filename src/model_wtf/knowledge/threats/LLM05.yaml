sid: LLM05
title: Excessive Agency via Unauthorized Tool Use
source: pytm v1.4.0
pytm_targets:
- LLM
elements: []
condition: target.hasAgentCapabilities is True and target.hasAccessToSensitiveSystems is True
  and target.controls.implementsPOLP is False
severity: Very High
likelihood: null
details: An LLM agent with tool-calling capabilities and access to sensitive systems, without
  proper least-privilege controls, may perform unintended or unauthorized actions. An attacker
  can exploit this by manipulating the LLM into using its tools to access, modify, or exfiltrate
  data from sensitive systems.
mitigations: Implement least privilege access for all LLM agent tools. Require human-in-the-loop
  approval for sensitive operations. Scope tool permissions to the minimum necessary. Monitor
  and audit all agent actions. Implement rate limiting on tool calls.
example: A customer support LLM agent has unrestricted database access. An attacker uses prompt
  injection to instruct the agent to query and return all customer records, bypassing normal
  access controls.
references: https://owasp.org/www-project-top-10-for-large-language-model-applications/, https://genai.owasp.org/llmrisk/llm08-excessive-agency/
prerequisites: The LLM has agent capabilities (tool use, function calling). The agent has
  access to sensitive systems (databases, APIs, filesystems). Least privilege controls are
  not enforced on the agent's capabilities.
