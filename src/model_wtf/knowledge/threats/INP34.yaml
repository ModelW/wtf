sid: INP34
title: SOAP Array Overflow
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.checksInputBounds is False
severity: High
likelihood: null
details: An attacker sends a SOAP request with an array whose actual length exceeds the length
  indicated in the request. When a data structure including a SOAP array is instantiated,
  the sender transmits the size of the array as an explicit parameter along with the data.
  If the server processing the transmission naively trusts the specified size, then an attacker
  can intentionally understate the size of the array, possibly resulting in a buffer overflow
  if the server attempts to read the entire data set into the memory it allocated for a smaller
  array. This, in turn, can lead to a server crash or even the execution of arbitrary code.
mitigations: If the server either verifies the correctness of the stated array size or if
  the server stops processing an array once the stated number of elements have been read,
  regardless of the actual array size, then this attack will fail. The former detects the
  malformed SOAP message while the latter ensures that the server does not attempt to load
  more data than was allocated for.
example: Refer to this example - http://projects.webappsec.org/w/page/13246962/SOAP%20Array%20Abuse
references: https://capec.mitre.org/data/definitions/256.html
prerequisites: The targeted SOAP server must trust that the array size as stated in messages
  it receives is correct, but read through the entire content of the message regardless of
  the stated size of the array.
