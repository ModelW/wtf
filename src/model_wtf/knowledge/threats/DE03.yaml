sid: DE03
title: Sniffing Attacks
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: (target.protocol == 'HTTP' or target.controls.isEncrypted is False) or target.usesVPN
  is False
severity: Medium
likelihood: null
details: In this attack pattern, the adversary intercepts information transmitted between
  two third parties. The adversary must be able to observe, read, and/or hear the communication
  traffic, but not necessarily block the communication or change its content. The adversary
  may precipitate or indirectly influence the content of the observed transaction, but is
  never the intended recipient of the information. Any transmission medium can theoretically
  be sniffed if the adversary can examine the contents between the sender and recipient.
mitigations: Encrypt sensitive information when transmitted on insecure mediums to prevent
  interception.
example: Attacker knows that the computer/OS/application can request new applications to install,
  or it periodically checks for an available update. The attacker loads the sniffer set up
  during Explore phase, and extracts the application code from subsequent communication. The
  attacker then proceeds to reverse engineer the captured code.
references: https://capec.mitre.org/data/definitions/157.html, http://cwe.mitre.org/data/definitions/311.html
prerequisites: The target data stream must be transmitted on a medium to which the adversary
  has access.
