sid: API01
title: Exploit Test APIs
source: pytm v1.4.0
pytm_targets:
- Process
- Lambda
elements:
- process
condition: target.implementsAPI is True
severity: High
likelihood: null
details: An attacker exploits a sample, demonstration, or test API that is insecure by default
  and should not be resident on production systems. Some applications include APIs that are
  intended to allow an administrator to test and refine their domain. These APIs should usually
  be disabled once a system enters a production environment. Testing APIs may expose a great
  deal of diagnostic information intended to aid an administrator, but which can also be used
  by an attacker to further refine their attack. Moreover, testing APIs may not have adequate
  security controls or may not have undergone rigorous testing since they were not intended
  for use in production environments. As such, they may have many flaws and vulnerabilities
  that would allow an attacker to severely disrupt a target.
mitigations: Ensure that production systems to not contain sample or test APIs and that these
  APIs are only used in development environments.
example: Since APIs can be accessed over the internet just like any other URI with some sensitive
  data attached to the request, they share the vulnerabilities of any other resource accessible
  on the internet like Man-in-the-middle, CSRF Attack, Denial of Services, etc.
references: https://capec.mitre.org/data/definitions/121.html, http://cwe.mitre.org/data/definitions/489.html
prerequisites: The target must have installed test APIs and failed to secure or remove them
  when brought into a production environment.
