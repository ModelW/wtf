sid: DO03
title: XML Ping of the Death
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: any(d.format == 'XML' for d in target.data)
severity: Medium
likelihood: null
details: An attacker initiates a resource depletion attack where a large number of small XML
  messages are delivered at a sufficiently rapid rate to cause a denial of service or crash
  of the target. Transactions such as repetitive SOAP transactions can deplete resources faster
  than a simple flooding attack because of the additional resources used by the SOAP protocol
  and the resources necessary to process SOAP messages. The transactions used are immaterial
  as long as they cause resource utilization on the target. In other words, this is a normal
  flooding attack augmented by using messages that will require extra processing on the target.
mitigations: 'Design: Build throttling mechanism into the resource allocation. Provide for
  a timeout mechanism for allocated resources whose transaction does not complete within a
  specified interval. Implementation: Provide for network flow control and traffic shaping
  to control access to the resources.'
example: Consider the case of attack performed against the createCustomerBillingAccount Web
  Service for an online store. In this case, the createCustomerBillingAccount Web Service
  receives a huge number of simultaneous requests, containing nonsense billing account creation
  information (the small XML messages). The createCustomerBillingAccount Web Services may
  forward the messages to other Web Services for processing. The application suffers from
  a high load of requests, potentially leading to a complete loss of availability the involved
  Web Service.
references: https://capec.mitre.org/data/definitions/147.html, http://cwe.mitre.org/data/definitions/400.html,
  http://cwe.mitre.org/data/definitions/770.html
prerequisites: The target must receive and process XML transactions.
