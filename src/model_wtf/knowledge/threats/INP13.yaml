sid: INP13
title: Command Delimiters
source: pytm v1.4.0
pytm_targets:
- Lambda
- Process
elements:
- process
condition: target.controls.validatesInput is False
severity: High
likelihood: null
details: An attack of this type exploits a programs' vulnerabilities that allows an attacker's
  commands to be concatenated onto a legitimate command with the intent of targeting other
  resources such as the file system or database. The system that uses a filter or a blacklist
  input validation, as opposed to whitelist validation is vulnerable to an attacker who predicts
  delimiters (or combinations of delimiters) not present in the filter or blacklist. As with
  other injection attacks, the attacker uses the command delimiter payload as an entry point
  to tunnel through the application and activate additional attacks through SQL queries, shell
  commands, network scanning, and so on.
mitigations: 'Design: Perform whitelist validation against a positive specification for command
  length, type, and parameters.Design: Limit program privileges, so if commands circumvent
  program input validation or filter routines then commands do not running under a privileged
  accountImplementation: Perform input validation for all remote content.Implementation: Use
  type conversions such as JDBC prepared statements.'
example: By appending special characters, such as a semicolon or other commands that are executed
  by the target process, the attacker is able to execute a wide variety of malicious commands
  in the target process space, utilizing the target's inherited permissions, against any resource
  the host has access to. The possibilities are vast including injection attacks against RDBMS
  (SQL Injection), directory servers (LDAP Injection), XML documents (XPath and XQuery Injection),
  and command line shells. In many injection attacks, the results are converted back to strings
  and displayed to the client process such as a web browser without tripping any security
  alarms, so the network firewall does not log any out of the ordinary behavior. LDAP servers
  house critical identity assets such as user, profile, password, and group information that
  is used to authenticate and authorize users. An attacker that can query the directory at
  will and execute custom commands against the directory server is literally working with
  the keys to the kingdom in many enterprises. When user, organizational units, and other
  directory objects are queried by building the query string directly from user input with
  no validation, or other conversion, then the attacker has the ability to use any LDAP commands
  to query, filter, list, and crawl against the LDAP server directly in the same manner as
  SQL injection gives the ability to the attacker to run SQL commands on the database.
references: https://capec.mitre.org/data/definitions/15.html, http://cwe.mitre.org/data/definitions/146.html,
  http://cwe.mitre.org/data/definitions/77.html, http://cwe.mitre.org/data/definitions/157.html,
  http://cwe.mitre.org/data/definitions/154.html
prerequisites: Software's input validation or filtering must not detect and block presence
  of additional malicious command.
