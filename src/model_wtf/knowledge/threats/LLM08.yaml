sid: LLM08
title: Sensitive Information Disclosure Through Output
source: pytm v1.4.0
pytm_targets:
- LLM
elements: []
condition: target.processesPersonalData is True and target.controls.encodesOutput is False
severity: High
likelihood: null
details: An LLM that processes personal data without output encoding or filtering may inadvertently
  include sensitive information in its responses. This can occur through memorization of training
  data, inclusion of context from other users' queries, or manipulation by adversarial prompts
  designed to extract sensitive data.
mitigations: Implement output filtering to detect and redact sensitive data patterns (PII,
  credentials, etc.). Use output encoding appropriate to the consumption context. Apply data
  loss prevention (DLP) controls on LLM outputs. Minimize the amount of sensitive data in
  the LLM's context.
example: A customer service LLM that has access to customer records is asked 'What is the
  account information for user X?' and returns their full name, address, and account number
  because no output filtering is in place to redact PII.
references: https://owasp.org/www-project-top-10-for-large-language-model-applications/, https://genai.owasp.org/llmrisk/llm06-sensitive-information-disclosure/
prerequisites: The LLM processes personal or sensitive data. Output encoding or filtering
  controls are not in place.
