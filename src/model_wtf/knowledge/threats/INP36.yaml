sid: INP36
title: HTTP Response Smuggling
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.implementsStrictHTTPValidation is False and target.controls.encodesHeaders
  is False
severity: Medium
likelihood: null
details: An attacker injects content into a server response that is interpreted differently
  by intermediaries than it is by the target browser. To do this, it takes advantage of inconsistent
  or incorrect interpretations of the HTTP protocol by various applications. For example,
  it might use different block terminating characters (CR or LF alone), adding duplicate header
  fields that browsers interpret as belonging to separate responses, or other techniques.
  Consequences of this attack can include response-splitting, cross-site scripting, apparent
  defacement of targeted sites, cache poisoning, or similar actions.
mitigations: 'Design: Employ strict adherence to interpretations of HTTP messages wherever
  possible.Implementation: Encode header information provided by user input so that user-supplied
  content is not interpreted by intermediaries.'
example: 'The attacker targets the cache service used by the organization to reduce load on
  the internet bandwidth. This server can be a cache server on the LAN or other application
  server caching the static WebPages. The attacker sends three different HTTP request as shown
  - Request 1: POST request for http://www.netbanking.com, Request 2: GET request for http:www.netbanking.com/FD.html,
  Request 3: GET request for http://www.netbanking.com/FD-Rates.html. Due to malformed request
  cache server assumes request 1 and 3 as valid request and forwards the entire request to
  the webserver. Webserver which strictly follow then HTTP parsing rule responds with the
  http://www.netbanking.com/FD.html  HTML page. This is happened because webserver consider
  request 1 and 2 as valid one. Cache server stores this response against the request 3. When
  normal users request for page http://www.netbanking.com/FD-Rates.html, cache server responds
  with the page http://www.netbanking.com/FD.html.Hence attacker will succeeds in cache poisoning.'
references: https://capec.mitre.org/data/definitions/273.html
prerequisites: The targeted server must allow the attacker to insert content that will appear
  in the server's response.
