severity: Very High
likelihood: null
details: Cross Site Tracing (XST) enables an adversary to steal the victim's session cookie
  and possibly other authentication credentials transmitted in the header of the HTTP request
  when the victim's browser communicates to destination system's web server. The adversary
  first gets a malicious script to run in the victim's browser that induces the browser to
  initiate an HTTP TRACE request to the web server. If the destination web server allows HTTP
  TRACE requests, it will proceed to return a response to the victim's web browser that contains
  the original HTTP request in its body. The function of HTTP TRACE, as defined by the HTTP
  specification, is to echo the request that the web server receives from the client back
  to the client. Since the HTTP header of the original request had the victim's session cookie
  in it, that session cookie can now be picked off the HTTP TRACE response and sent to the
  adversary's malicious site. XST becomes relevant when direct access to the session cookie
  via the document.cookie object is disabled with the use of httpOnly attribute which ensures
  that the cookie can be transmitted in HTTP requests but cannot be accessed in other ways.
  Using SSL does not protect against XST. If the system with which the victim is interacting
  is susceptible to XSS, an adversary can exploit that weakness directly to get his or her
  malicious script to issue an HTTP TRACE request to the destination system's web server.
  In the absence of an XSS weakness on the site with which the victim is interacting, an adversary
  can get the script to come from the site that he controls and get it to execute in the victim's
  browser (if he can trick the victim's into visiting his malicious website or clicking on
  the link that he supplies). However, in that case, due to the same origin policy protection
  mechanism in the browser, the adversary's malicious script cannot directly issue an HTTP
  TRACE request to the destination system's web server because the malicious script did not
  originate at that domain. An adversary will then need to find a way to exploit another weakness
  that would enable him or her to get around the same origin policy protection.
mitigations: Administrators should disable support for HTTP TRACE at the destination's web
  server. Vendors should disable TRACE by default. Patch web browser against known security
  origin policy bypass exploits.
example: An adversary determines that a particular system is vulnerable to reflected cross-site
  scripting (XSS) and endeavors to leverage this weakness to steal the victim's authentication
  cookie. An adversary realizes that since httpOnly attribute is set on the user's cookie,
  it is not possible to steal it directly with his malicious script. Instead, the adversary
  has their script use XMLHTTP ActiveX control in the victim's IE browser to issue an HTTP
  TRACE to the target system's server which has HTTP TRACE enabled. The original HTTP TRACE
  request contains the session cookie and so does the echoed response. The adversary picks
  the session cookie from the body of HTTP TRACE response and ships it to the adversary. The
  adversary then uses the newly acquired victim's session cookie to impersonate the victim
  in the target system.
references: https://capec.mitre.org/data/definitions/107.html, http://cwe.mitre.org/data/definitions/693.html,
  http://cwe.mitre.org/data/definitions/648.html
prerequisites: HTTP TRACE is enabled on the web serverThe destination system is susceptible
