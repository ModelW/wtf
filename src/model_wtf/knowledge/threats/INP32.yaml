sid: INP32
title: XML Injection
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.validatesInput is False or target.controls.sanitizesInput is False
  or target.controls.encodesOutput is False
severity: High
likelihood: null
details: An attacker utilizes crafted XML user-controllable input to probe, attack, and inject
  data into the XML database, using techniques similar to SQL injection. The user-controllable
  input can allow for unauthorized viewing of data, bypassing authentication or the front-end
  application for direct XML database access, and possibly altering database information.
mitigations: Strong input validation - All user-controllable input must be validated and filtered
  for illegal characters as well as content that can be interpreted in the context of an XML
  data or a query. Use of custom error pages - Attackers can glean information about the nature
  of queries from descriptive error messages. Input validation must be coupled with customized
  error pages that inform about an error without disclosing information about the database
  or application.
example: Consider an application that uses an XML database to authenticate its users. The
  application retrieves the user name and password from a request and forms an XPath expression
  to query the database. An attacker can successfully bypass authentication and login without
  valid credentials through XPath Injection. This can be achieved by injecting the query to
  the XML database with XPath syntax that causes the authentication check to fail. Improper
  validation of user-controllable input and use of a non-parameterized XPath expression enable
  the attacker to inject an XPath expression that causes authentication bypass.
references: https://capec.mitre.org/data/definitions/250.html
prerequisites: XML queries used to process user input and retrieve information stored in XML
  documentsUser-controllable input not properly sanitized
