sid: AC24
title: Use of hardcoded credentials
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: any(d.isCredentials for d in target.data) and target.sink.inScope and any(d.credentialsLife
  == Lifetime.HARDCODED for d in target.data)
severity: Very High
likelihood: null
details: Hardcoded credentials (password or certificates) cannot be changed and if these credentials
  are dislcosed they can be used by attackers to bypass the authentication mechanism.
mitigations: Avoid hardcoded credentials. If you have to use hardcoded credentials make is
  possible to change the credentials or to deactivate them. A typical design is to use a "first
  login"-mode which forces the user to create new credentials, on the first login. If the
  credentials cannot be changed the sole actions in prodcution for the defender is to deactivate/remove
  the effected product.
