sid: HA04
title: Reverse Engineering
source: pytm v1.4.0
pytm_targets:
- ExternalEntity
elements:
- party
condition: target.hasPhysicalAccess is True
severity: Low
likelihood: null
details: An adversary discovers the structure, function, and composition of an object, resource,
  or system by using a variety of analysis techniques to effectively determine how the analyzed
  entity was constructed or operates. The goal of reverse engineering is often to duplicate
  the function, or a part of the function, of an object in order to duplicate or back engineer
  some aspect of its functioning. Reverse engineering techniques can be applied to mechanical
  objects, electronic devices, or software, although the methodology and techniques involved
  in each type of analysis differ widely.
mitigations: Employ code obfuscation techniques to prevent the adversary from reverse engineering
  the targeted entity.
example: When adversaries are reverse engineering software, methodologies fall into two broad
  categories, 'white box' and 'black box.' White box techniques involve methods which can
  be applied to a piece of software when an executable or some other compiled object can be
  directly subjected to analysis, revealing at least a portion of its machine instructions
  that can be observed upon execution. 'Black Box' methods involve interacting with the software
  indirectly, in the absence of the ability to measure, instrument, or analyze an executable
  object directly. Such analysis typically involves interacting with the software at the boundaries
  of where the software interfaces with a larger execution environment, such as input-output
  vectors, libraries, or APIs.
references: https://capec.mitre.org/data/definitions/188.html
prerequisites: Access to targeted system, resources, and information.
