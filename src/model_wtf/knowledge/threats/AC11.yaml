sid: AC11
title: Session Credential Falsification through Manipulation
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.usesStrongSessionIdentifiers is False
severity: Medium
likelihood: null
details: An attacker manipulates an existing credential in order to gain access to a target
  application. Session credentials allow users to identify themselves to a service after an
  initial authentication without needing to resend the authentication information (usually
  a username and password) with every message. An attacker may be able to manipulate a credential
  sniffed from an existing connection in order to gain access to a target server. For example,
  a credential in the form of a web cookie might have a field that indicates the access rights
  of a user. By manually tweaking this cookie, a user might be able to increase their access
  rights to the server. Alternately an attacker may be able to manipulate an existing credential
  to appear as a different user. This attack differs from falsification through prediction
  in that the user bases their modified credentials off existing credentials instead of using
  patterns detected in prior credentials to create a new credential that is accepted because
  it fits the pattern. As a result, an attacker may be able to impersonate other users or
  elevate their permissions to a targeted service.
mitigations: 'Implementation: Use session IDs that are difficult to guess or brute-force:
  One way for the attackers to obtain valid session IDs is by brute-forcing or guessing them.
  By choosing session identifiers that are sufficiently random, brute-forcing or guessing
  becomes very difficult. Implementation: Regenerate and destroy session identifiers when
  there is a change in the level of privilege: This ensures that even though a potential victim
  may have followed a link with a fixated identifier, a new one is issued when the level of
  privilege changes.'
example: An adversary uses client side scripting(JavaScript) to set session ID in the victim's
  browser using document.cookie. This fixates a falsified session credential into victim's
  browser with the help of a crafted URL link. Once the victim clicks on the link, the attacker
  is able to bypass authentication or piggyback off some other authenticated victim's session.
references: https://capec.mitre.org/data/definitions/226.html, http://cwe.mitre.org/data/definitions/565.html,
  http://cwe.mitre.org/data/definitions/472.html
prerequisites: The targeted application must use session credentials to identify legitimate
  users.
