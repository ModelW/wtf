sid: AC01
title: Privilege Abuse
source: pytm v1.4.0
pytm_targets:
- Server
- Process
- Datastore
elements:
- process
- store
condition: target.controls.hasAccessControl is False or target.controls.authorizesSource is
  False
severity: Medium
likelihood: null
details: An adversary is able to exploit features of the target that should be reserved for
  privileged users or administrators but are exposed to use by lower or non-privileged accounts.
  Access to sensitive information and functionality must be controlled to ensure that only
  authorized users are able to access these resources. If access control mechanisms are absent
  or misconfigured, a user may be able to access resources that are intended only for higher
  level users. An adversary may be able to exploit this to utilize a less trusted account
  to gain information and perform activities reserved for more trusted accounts. This attack
  differs from privilege escalation and other privilege stealing attacks in that the adversary
  never actually escalates their privileges but instead is able to use a lesser degree of
  privilege to access resources that should be (but are not) reserved for higher privilege
  accounts. Likewise, the adversary does not exploit trust or subvert systems - all control
  functionality is working as configured but the configuration does not adequately protect
  sensitive resources at an appropriate level.
mitigations: Use strong authentication and authorization mechanisms. A proven protocol is
  OAuth 2.0, which enables a third-party application to obtain limited access to an API.
example: An adversary that has previously obtained unauthorized access to certain device resources,
  uses that access to obtain information such as location and network information.
references: https://capec.mitre.org/data/definitions/122.html, http://cwe.mitre.org/data/definitions/732.html,
  http://cwe.mitre.org/data/definitions/269.html
prerequisites: The target must have misconfigured their access control mechanisms such that
  sensitive information, which should only be accessible to more trusted users, remains accessible
  to less trusted users.The adversary must have access to the target, albeit with an account
  that is less privileged than would be appropriate for the targeted resources.
