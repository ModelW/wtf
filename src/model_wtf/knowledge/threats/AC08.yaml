sid: AC08
title: Manipulate Registry Information
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.hasAccessControl is False
severity: Medium
likelihood: null
details: An adversary exploits a weakness in authorization in order to modify content within
  a registry (e.g., Windows Registry, Mac plist, application registry). Editing registry information
  can permit the adversary to hide configuration information or remove indicators of compromise
  to cover up activity. Many applications utilize registries to store configuration and service
  information. As such, modification of registry information can affect individual services
  (affecting billing, authorization, or even allowing for identity spoofing) or the overall
  configuration of a targeted application. For example, both Java RMI and SOAP use registries
  to track available services. Changing registry values is sometimes a preliminary step towards
  completing another attack pattern, but given the long term usage of many registry values,
  manipulation of registry information could be its own end.
mitigations: Ensure proper permissions are set for Registry hives to prevent users from modifying
  keys.Employ a robust and layered defensive posture in order to prevent unauthorized users
  on your system.Employ robust identification and audit/blocking via whitelisting of applications
  on your system. Unnecessary applications, utilities, and configurations will have a presence
  in the system registry that can be leveraged by an adversary through this attack pattern.
example: Manipulating registration information can be undertaken in advance of a path traversal
  attack (inserting relative path modifiers) or buffer overflow attack (enlarging a registry
  value beyond an application's ability to store it).
references: https://capec.mitre.org/data/definitions/203.html, http://cwe.mitre.org/data/definitions/15.html
prerequisites: The targeted application must rely on values stored in a registry.The adversary
  must have a means of elevating permissions in order to access and modify registry content
  through either administrator privileges (e.g., credentialed access), or a remote access
  tool capable of editing a registry through an API.
