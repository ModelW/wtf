sid: SC03
title: Embedding Scripts within Scripts
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.validatesInput is False or target.controls.sanitizesInput is False
  or target.controls.hasAccessControl is False
severity: High
likelihood: null
details: An attack of this type exploits a programs' vulnerabilities that are brought on by
  allowing remote hosts to execute scripts. The adversary leverages this capability to execute
  his/her own script by embedding it within other scripts that the target software is likely
  to execute. The adversary must have the ability to inject their script into a script that
  is likely to be executed. If this is done, then the adversary can potentially launch a variety
  of probes and attacks against the web server's local environment, in many cases the so-called
  DMZ, back end resources the web server can communicate with, and other hosts. With the proliferation
  of intermediaries, such as Web App Firewalls, network devices, and even printers having
  JVMs and Web servers, there are many locales where an attacker can inject malicious scripts.
  Since this attack pattern defines scripts within scripts, there are likely privileges to
  execute said attack on the host. These attacks are not solely limited to the server side,
  client side scripts like Ajax and client side JavaScript can contain malicious scripts as
  well.
mitigations: Use browser technologies that do not allow client side scripting.Utilize strict
  type, character, and encoding enforcement.Server side developers should not proxy content
  via XHR or other means. If a HTTP proxy for remote content is setup on the server side,
  the client's browser has no way of discerning where the data is originating from.Ensure
  all content that is delivered to client is sanitized against an acceptable content specification.Perform
  input validation for all remote content.Perform output validation for all remote content.Disable
  scripting languages such as JavaScript in browserSession tokens for specific hostPatching
  software. There are many attack vectors for XSS on the client side and the server side.
  Many vulnerabilities are fixed in service packs for browser, web servers, and plug in technologies,
  staying current on patch release that deal with XSS countermeasures mitigates this.Privileges
  are constrained, if a script is loaded, ensure system runs in chroot jail or other limited
  authority mode
example: Ajax applications enable rich functionality for browser based web applications. Applications
  like Google Maps deliver unprecedented ability to zoom in and out, scroll graphics, and
  change graphic presentation through Ajax. The security issues that an attacker may exploit
  in this instance are the relative lack of security features in JavaScript and the various
  browser's implementation of JavaScript, these security gaps are what XSS and a host of other
  client side vulnerabilities are based on. While Ajax may not open up new security holes,
  per se, due to the conversational aspects between client and server of Ajax communication,
  attacks can be optimized. A single zoom in or zoom out on a graphic in an Ajax application
  may round trip to the server dozens of times. One of the first steps many attackers take
  is frequently footprinting an environment, this can include scanning local addresses like
  192.*.*.* IP addresses, checking local directories, files, and settings for known vulnerabilities,
  and so on. <IMG SRC=javascript:alert('XSS')> The XSS script that is embedded in a given
  IMG tag can be manipulated to probe a different address on every click of the mouse or other
  motions that the Ajax application is aware of. In addition the enumerations allow for the
  attacker to nest sequential logic in the attacks. While Ajax applications do not open up
  brand new attack vectors, the existing attack vectors are more than adequate to execute
  attacks, and now these attacks can be optimized to sequentially execute and enumerate host
  environments.~/.bash_profile and ~/.bashrc are executed in a user's context when a new shell
  opens or when a user logs in so that their environment is set correctly. ~/.bash_profile
  is executed for login shells and ~/.bashrc is executed for interactive non-login shells.
  This means that when a user logs in (via username and password) to the console (either locally
  or remotely via something like SSH), ~/.bash_profile is executed before the initial command
  prompt is returned to the user. After that, every time a new shell is opened, ~/.bashrc
  is executed. This allows users more fine grained control over when they want certain commands
  executed. These files are meant to be written to by the local user to configure their own
  environment; however, adversaries can also insert code into these files to gain persistence
  each time a user logs in or opens a new shell.
references: https://capec.mitre.org/data/definitions/19.html, http://cwe.mitre.org/data/definitions/284.html
prerequisites: Target software must be able to execute scripts, and also grant the adversary
  privilege to write/upload scripts.
