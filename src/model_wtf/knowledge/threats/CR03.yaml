sid: CR03
title: Dictionary-based Password Attack
source: pytm v1.4.0
pytm_targets:
- Process
- Server
elements:
- process
condition: target.controls.implementsAuthenticationScheme is False
severity: High
likelihood: null
details: An attacker tries each of the words in a dictionary as passwords to gain access to
  the system via some user's account. If the password chosen by the user was a word within
  the dictionary, this attack will be successful (in the absence of other mitigations). This
  is a specific instance of the password brute forcing attack pattern.
mitigations: Create a strong password policy and ensure that your system enforces this policy.Implement
  an intelligent password throttling mechanism. Care must be taken to assure that these mechanisms
  do not excessively enable account lockout attacks such as CAPEC-02.
example: 'A system user selects the word treacherous as their passwords believing that it
  would be very difficult to guess. The password-based dictionary attack is used to crack
  this password and gain access to the account.The Cisco LEAP challenge/response authentication
  mechanism uses passwords in a way that is susceptible to dictionary attacks, which makes
  it easier for remote attackers to gain privileges via brute force password guessing attacks.
  Cisco LEAP is a mutual authentication algorithm that supports dynamic derivation of session
  keys. With Cisco LEAP, mutual authentication relies on a shared secret, the user''s logon
  password (which is known by the client and the network), and is used to respond to challenges
  between the user and the Remote Authentication Dial-In User Service (RADIUS) server. Methods
  exist for someone to write a tool to launch an offline dictionary attack on password-based
  authentications that leverage Microsoft MS-CHAP, such as Cisco LEAP. The tool leverages
  large password lists to efficiently launch offline dictionary attacks against LEAP user
  accounts, collected through passive sniffing or active techniques.See also: CVE-2003-1096'
references: https://capec.mitre.org/data/definitions/16.html, http://cwe.mitre.org/data/definitions/521.html,
  http://cwe.mitre.org/data/definitions/262.html, http://cwe.mitre.org/data/definitions/263.html
prerequisites: The system uses one factor password based authentication.The system does not
  have a sound password policy that is being enforced.The system does not implement an effective
  password throttling mechanism.
