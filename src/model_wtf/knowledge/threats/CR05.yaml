sid: CR05
title: Encryption Brute Forcing
source: pytm v1.4.0
pytm_targets:
- Server
- Datastore
elements:
- process
- store
condition: target.controls.usesEncryptionAlgorithm != 'RSA' and target.controls.usesEncryptionAlgorithm
  != 'AES'
severity: Low
likelihood: null
details: An attacker, armed with the cipher text and the encryption algorithm used, performs
  an exhaustive (brute force) search on the key space to determine the key that decrypts the
  cipher text to obtain the plaintext.
mitigations: Use commonly accepted algorithms and recommended key sizes. The key size used
  will depend on how important it is to keep the data confidential and for how long.In theory
  a brute force attack performing an exhaustive key space search will always succeed, so the
  goal is to have computational security. Moore's law needs to be taken into account that
  suggests that computing resources double every eighteen months.
example: In 1997 the original DES challenge used distributed net computing to brute force
  the encryption key and decrypt the ciphertext to obtain the original plaintext. Each machine
  was given its own section of the key space to cover. The ciphertext was decrypted in 96
  days.
references: https://capec.mitre.org/data/definitions/20.html, http://cwe.mitre.org/data/definitions/326.html,
  http://cwe.mitre.org/data/definitions/327.html, http://cwe.mitre.org/data/definitions/693.html,
  http://cwe.mitre.org/data/definitions/719.html
prerequisites: Ciphertext is known.Encryption algorithm and key size are known.
