sid: DO02
title: Excessive Allocation
source: pytm v1.4.0
pytm_targets:
- Process
- Server
- Datastore
- Lambda
elements:
- process
- store
condition: target.controls.handlesResourceConsumption is False
severity: Medium
likelihood: null
details: An adversary causes the target to allocate excessive resources to servicing the attackers'
  request, thereby reducing the resources available for legitimate services and degrading
  or denying services. Usually, this attack focuses on memory allocation, but any finite resource
  on the target could be the attacked, including bandwidth, processing cycles, or other resources.
  This attack does not attempt to force this allocation through a large number of requests
  (that would be Resource Depletion through Flooding) but instead uses one or a small number
  of requests that are carefully formatted to force the target to allocate excessive resources
  to service this request(s). Often this attack takes advantage of a bug in the target to
  cause the target to allocate resources vastly beyond what would be needed for a normal request.
mitigations: Limit the amount of resources that are accessible to unprivileged users. Assume
  all input is malicious. Consider all potentially relevant properties when validating input.
  Consider uniformly throttling all requests in order to make it more difficult to consume
  resources more quickly than they can again be freed. Use resource-limiting settings, if
  possible.
example: In an Integer Attack, the adversary could cause a variable that controls allocation
  for a request to hold an excessively large value. Excessive allocation of resources can
  render a service degraded or unavailable to legitimate users and can even lead to crashing
  of the target.
references: https://capec.mitre.org/data/definitions/130.html, http://cwe.mitre.org/data/definitions/770.html,
  http://cwe.mitre.org/data/definitions/404.html
prerequisites: The target must accept service requests from the attacker and the adversary
  must be able to control the resource allocation associated with this request to be in excess
  of the normal allocation. The latter is usually accomplished through the presence of a bug
  on the target that allows the adversary to manipulate variables used in the allocation.
