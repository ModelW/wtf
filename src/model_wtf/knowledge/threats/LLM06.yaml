sid: LLM06
title: Arbitrary Code Execution via LLM Agent
source: pytm v1.4.0
pytm_targets:
- LLM
elements: []
condition: target.executesCode is True and target.controls.isHardened is False
severity: Very High
likelihood: null
details: An LLM that can generate and execute code, without hardened execution environments,
  poses a risk of arbitrary code execution. An attacker can manipulate the LLM into generating
  malicious code that, when executed, compromises the host system, exfiltrates data, or establishes
  persistence.
mitigations: Run generated code in sandboxed environments (containers, VMs, or WebAssembly).
  Implement strict resource limits (CPU, memory, network, filesystem). Use allowlists for
  permitted operations and libraries. Review generated code before execution. Disable network
  access in code execution environments.
example: A code assistant LLM is manipulated into generating a Python script that reads SSH
  keys from the host filesystem and sends them to an attacker-controlled server, exploiting
  the lack of sandboxing.
references: https://owasp.org/www-project-top-10-for-large-language-model-applications/, https://genai.owasp.org/llmrisk/llm08-excessive-agency/
prerequisites: The LLM can generate and execute code. The execution environment is not hardened
  (e.g., no sandboxing, no resource limits).
