sid: AC06
title: Using Malicious Files
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.isHardened is False or target.controls.hasAccessControl is False
severity: Very High
likelihood: null
details: An attack of this type exploits a system's configuration that allows an attacker
  to either directly access an executable file, for example through shell access; or in a
  possible worst case allows an attacker to upload a file and then execute it. Web servers,
  ftp servers, and message oriented middleware systems which have many integration points
  are particularly vulnerable, because both the programmers and the administrators must be
  in synch regarding the interfaces and the correct privileges for each interface.
mitigations: 'Design: Enforce principle of least privilegeDesign: Run server interfaces with
  a non-root account and/or utilize chroot jails or other configuration techniques to constrain
  privileges even if attacker gains some limited access to commands.Implementation: Perform
  testing such as pen-testing and vulnerability scanning to identify directories, programs,
  and interfaces that grant direct access to executables.'
example: Consider a directory on a web server with the following permissions drwxrwxrwx 5
  admin public 170 Nov 17 01:08 webroot This could allow an attacker to both execute and upload
  and execute programs' on the web server. This one vulnerability can be exploited by a threat
  to probe the system and identify additional vulnerabilities to exploit.
references: https://capec.mitre.org/data/definitions/17.html, http://cwe.mitre.org/data/definitions/732.html,
  http://cwe.mitre.org/data/definitions/272.html, http://cwe.mitre.org/data/definitions/270.html
prerequisites: System's configuration must allow an attacker to directly access executable
  files or upload files to execute. This means that any access control system that is supposed
  to mediate communications between the subject and the object is set incorrectly or assumes
  a benign environment.
