sid: AC17
title: Session Hijacking - ServerSide
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.usesStrongSessionIdentifiers is False
severity: Very High
likelihood: null
details: This type of attack involves an adversary that exploits weaknesses in an application's
  use of sessions in performing authentication. The advarsary is able to steal or manipulate
  an active session and use it to gain unathorized access to the application.
mitigations: Properly encrypt and sign identity tokens in transit, and use industry standard
  session key generation mechanisms that utilize high amount of entropy to generate the session
  key. Many standard web and application servers will perform this task on your behalf. Utilize
  a session timeout for all sessions. If the user does not explicitly logout, terminate their
  session after this period of inactivity. If the user logs back in then a new session key
  should be generated.
example: Cross Site Injection Attack is a great example of Session Hijacking. Attacker can
  capture victim’s Session ID using XSS attack by using javascript. If an attacker sends a
  crafted link to the victim with the malicious JavaScript, when the victim clicks on the
  link, the JavaScript will run and complete the instructions made by the attacker.
references: https://capec.mitre.org/data/definitions/593.html
prerequisites: An application that leverages sessions to perform authentication.
