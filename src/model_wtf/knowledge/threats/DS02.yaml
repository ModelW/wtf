sid: DS02
title: Try All Common Switches
source: pytm v1.4.0
pytm_targets:
- Lambda
- Process
elements:
- process
condition: target.environment == 'Production'
severity: Medium
likelihood: null
details: An attacker attempts to invoke all common switches and options in the target application
  for the purpose of discovering weaknesses in the target. For example, in some applications,
  adding a --debug switch causes debugging information to be displayed, which can sometimes
  reveal sensitive processing or configuration information to an attacker. This attack differs
  from other forms of API abuse in that the attacker is blindly attempting to invoke options
  in the hope that one of them will work rather than specifically targeting a known option.
  Nonetheless, even if the attacker is familiar with the published options of a targeted application
  this attack method may still be fruitful as it might discover unpublicized functionality.
mitigations: 'Design: Minimize switch and option functionality to only that necessary for
  correct function of the command. Implementation: Remove all debug and testing options from
  production code.'
example: Adversary is able to exploit the debug switch to discover unpublicized functionality.
references: https://capec.mitre.org/data/definitions/133.html, http://cwe.mitre.org/data/definitions/912.html
prerequisites: The attacker must be able to control the options or switches sent to the target.
