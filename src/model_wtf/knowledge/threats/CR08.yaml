sid: CR08
title: Client-Server Protocol Manipulation
source: pytm v1.4.0
pytm_targets:
- Dataflow
elements:
- flow
condition: not target.controls.isEncrypted or target.tlsVersion < target.sink.minTLSVersion
severity: Medium
likelihood: null
details: An adversary takes advantage of weaknesses in the protocol by which a client and
  server are communicating to perform unexpected actions. Communication protocols are necessary
  to transfer messages between client and server applications. Moreover, different protocols
  may be used for different types of interactions. For example, an authentication protocol
  might be used to establish the identities of the server and client while a separate messaging
  protocol might be used to exchange data. If there is a weakness in a protocol used by the
  client and server, an attacker might take advantage of this to perform various types of
  attacks. For example, if the attacker is able to manipulate an authentication protocol,
  the attacker may be able spoof other clients or servers. If the attacker is able to manipulate
  a messaging protocol, the may be able to read sensitive information or modify message contents.
  This attack is often made easier by the fact that many clients and servers support multiple
  protocols to perform similar roles. For example, a server might support several different
  authentication protocols in order to support a wide range of clients, including legacy clients.
  Some of the older protocols may have vulnerabilities that allow an attacker to manipulate
  client-server interactions.
mitigations: Use strong authentication protocols.
example: An adversary could exploit existing communication protocol vulnerabilities and can
  launch MITM attacks and gain sensitive information or spoof client/server identities.
references: https://capec.mitre.org/data/definitions/220.html, http://cwe.mitre.org/data/definitions/757.html
prerequisites: The client and/or server must utilize a protocol that has a weakness allowing
  manipulation of the interaction.
