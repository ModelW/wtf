sid: INP37
title: HTTP Request Smuggling
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.implementsStrictHTTPValidation is False and target.controls.encodesHeaders
  is False
severity: High
likelihood: null
details: HTTP Request Smuggling results from the discrepancies in parsing HTTP requests between
  HTTP entities such as web caching proxies or application firewalls. Entities such as web
  servers, web caching proxies, application firewalls or simple proxies often parse HTTP requests
  in slightly different ways. Under specific situations where there are two or more such entities
  in the path of the HTTP request, a specially crafted request is seen by two attacked entities
  as two different sets of requests. This allows certain requests to be smuggled through to
  a second entity without the first one realizing it.
mitigations: HTTP Request Smuggling is usually targeted at web servers. Therefore, in such
  cases, careful analysis of the entities must occur during system design prior to deployment.
  If there are known differences in the way the entities parse HTTP requests, the choice of
  entities needs consideration.Employing an application firewall can help. However, there
  are instances of the firewalls being susceptible to HTTP Request Smuggling as well.
example: 'When using Sun Java System Web Proxy Server 3.x or 4.x in conjunction with Sun ONE/iPlanet
  6.x, Sun Java System Application Server 7.x or 8.x, it is possible to bypass certain application
  firewall protections, hijack web sessions, perform Cross Site Scripting or poison the web
  proxy cache using HTTP Request Smuggling. Differences in the way HTTP requests are parsed
  by the Proxy Server and the Application Server enable malicious requests to be smuggled
  through to the Application Server, thereby exposing the Application Server to aforementioned
  attacks. See also: CVE-2006-6276Apache server 2.0.45 and version before 1.3.34, when used
  as a proxy, easily lead to web cache poisoning and bypassing of application firewall restrictions
  because of non-standard HTTP behavior. Although the HTTP/1.1 specification clearly states
  that a request with both Content-Length and a Transfer-Encoding: chunked headers is invalid,
  vulnerable versions of Apache accept such requests and reassemble the ones with Transfer-Encoding:
  chunked header without replacing the existing Content-Length header or adding its own. This
  leads to HTTP Request Smuggling using a request with a chunked body and a header with Content-Length:
  0. See also: CVE-2005-2088'
references: https://capec.mitre.org/data/definitions/33.html
prerequisites: An additional HTTP entity such as an application firewall or a web caching
  proxy between the attacker and the second entity such as a web serverDifferences in the
  way the two HTTP entities parse HTTP requests
