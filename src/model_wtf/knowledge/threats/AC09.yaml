sid: AC09
title: Functionality Misuse
source: pytm v1.4.0
pytm_targets:
- Server
elements:
- process
condition: target.controls.hasAccessControl is False or target.controls.authorizesSource is
  False
severity: Medium
likelihood: null
details: An adversary leverages a legitimate capability of an application in such a way as
  to achieve a negative technical impact. The system functionality is not altered or modified
  but used in a way that was not intended. This is often accomplished through the overuse
  of a specific functionality or by leveraging functionality with design flaws that enables
  the adversary to gain access to unauthorized, sensitive data.
mitigations: Perform comprehensive threat modeling, a process of identifying, evaluating,
  and mitigating potential threats to the application. This effort can help reveal potentially
  obscure application functionality that can be manipulated for malicious purposes.When implementing
  security features, consider how they can be misused and compromised.
example: An attacker clicks on the 'forgot password' and is presented with a single security
  question. The question is regarding the name of the first dog of the user. The system does
  not limit the number of attempts to provide the dog's name. An attacker goes through a list
  of 100 most popular dog names and finds the right name, thus getting the ability to reset
  the password and access the system.
references: https://capec.mitre.org/data/definitions/212.html
prerequisites: The adversary has the capability to interact with the application directly.The
  target system does not adequately implement safeguards to prevent misuse of authorized actions/processes.
