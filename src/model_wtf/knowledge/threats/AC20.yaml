sid: AC20
title: Reusing Session IDs (aka Session Replay) - ClientSide
source: pytm v1.4.0
pytm_targets:
- Process
elements:
- process
condition: target.controls.definesConnectionTimeout is False and (target.controls.usesMFA
  is False or target.controls.encryptsSessionData is False)
severity: High
likelihood: null
details: This attack targets the reuse of valid session ID to spoof the target system in order
  to gain privileges. The attacker tries to reuse a stolen session ID used previously during
  a transaction to perform spoofing and session hijacking. Another name for this type of attack
  is Session Replay.
mitigations: Always invalidate a session ID after the user logout.Setup a session time out
  for the session IDs.Protect the communication between the client and server. For instance
  it is best practice to use SSL to mitigate man in the middle attack.Do not code send session
  ID with GET method, otherwise the session ID will be copied to the URL. In general avoid
  writing session IDs in the URLs. URLs can get logged in log files, which are vulnerable
  to an attacker.Encrypt the session data associated with the session ID.Use multifactor authentication.
example: 'OpenSSL and SSLeay allow remote attackers to reuse SSL sessions and bypass access
  controls. See also: CVE-1999-0428Merak Mail IceWarp Web Mail uses a static identifier as
  a user session ID that does not change across sessions, which could allow remote attackers
  with access to the ID to gain privileges as that user, e.g. by extracting the ID from the
  user''s answer or forward URLs. See also: CVE-2002-0258'
references: https://capec.mitre.org/data/definitions/60.html
prerequisites: The target host uses session IDs to keep track of the users.Session IDs are
  used to control access to resources.The session IDs used by the target host are not well
  protected from session theft.
