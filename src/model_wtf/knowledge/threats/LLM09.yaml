sid: LLM09
title: Untrusted Tool Launch Configuration
source: pytm v1.4.0
pytm_targets:
- Agent
elements: []
condition: target.usesExternalTools is True and target.validatesToolLaunchConfig is False
severity: High
likelihood: null
details: An agentic harness that launches external tools or local servers from untrusted or
  weakly validated configuration can treat setup metadata as execution authority. In local
  tool integrations, including MCP-style stdio servers, command and argument configuration
  may determine which local process is started.
mitigations: Validate tool and server launch configuration before execution. Use allowlisted
  commands and arguments, deny inline execution patterns, require explicit approval for new
  tools, and run tools with least privilege.
example: An agentic client loads a tool configuration that appears to be setup data but controls
  a local stdio server launch command. Without a policy gate, changing the configuration changes
  what local process is executed.
references: https://owasp.org/www-project-mcp-top-10/, https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
prerequisites: The agentic harness can use external tools or local servers. Tool/server launch
  configuration is accepted without validation or policy checks.
