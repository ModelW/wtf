description: Passwords, tokens, secrets, API keys
priority: 20
match:
  - name: '(^|_)(password|passwd|pwd|secret|token|api_key|apikey|private_key|otp|totp|salt|nonce|signature)(_|$)|(^|_)(secret_key|private_key|access_key|api_key|auth_key|signing_key)$'
pii: false
sensitivity: confidential
category: credentials
