package: wagtail
assumption: >
  Serialised CMS content (pages, snippets, their drafts and search index):
  it holds personal data exactly when a page or snippet model of this
  project has personal fields (an author bio, a staff directory, a contact
  page with a person's phone).
check: >
  Look at the project's Page and snippet models for personal fields; if any,
  declare the same contents here.
fields:
  title: {pii: false, sensitivity: internal, category: technical, fixed: false}
  title_norm: {pii: false, sensitivity: internal, category: technical, fixed: false}
  title_text: {pii: false, sensitivity: internal, category: technical, fixed: false}
  autocomplete: {pii: false, sensitivity: internal, category: content, fixed: false}
  body: {pii: false, sensitivity: internal, category: content, fixed: false}
  body_text: {pii: false, sensitivity: internal, category: content, fixed: false}
fields_default: {pii: false, sensitivity: internal, category: technical, fixed: true}
