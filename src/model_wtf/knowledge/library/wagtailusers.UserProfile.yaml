package: wagtail
fields:
  submitted_notifications: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  approved_notifications: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  rejected_notifications: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  updated_comments_notifications: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  preferred_language: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  current_time_zone: {pii: true, sensitivity: personal, category: location, fixed: true}
  avatar@files.content: {pii: true, sensitivity: personal, category: identity, fixed: true}
  dismissibles: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  theme: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  contrast: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  density: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  keyboard_shortcuts: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
fields_default: {pii: false, sensitivity: internal, category: technical, fixed: true}
rights:
  # The staff member's own preferences: they edit them in the account
  # screen; the row goes with the user (CASCADE).
  erase: {exempt: contract_active, note: "deleted with the staff account (CASCADE)"}
  retention: {exempt: contract_active, note: "lives with the staff account"}
