package: django
assumption: >
  `object_repr` and `change_message` quote the edited object's `__str__` and
  the names of the changed fields. They carry personal data exactly when a
  model holding personal data has a `__str__` that returns it (a person's
  name, an email).
check: >
  Look at `__str__` of every model registered in the admin that holds
  personal fields; if any returns a name or email, `object_repr` is personal
  identity data.
fields:
  user: {pii: true, sensitivity: personal, category: behavioural, fixed: true}
  object_repr: {pii: true, sensitivity: personal, category: identity, fixed: false}
  change_message: {pii: false, sensitivity: internal, category: technical, fixed: false}
fields_default: {pii: false, sensitivity: internal, category: technical, fixed: true}
rights:
  # An audit trail exists to prove who did what: it is kept for
  # accountability (Art. 5(2)) and is not the person's to edit or erase.
  rectify: {exempt: legal_obligation, note: "audit trail: integrity of the record (Art. 5(2) accountability)"}
  erase: {exempt: legal_obligation, note: "audit trail kept for accountability (Art. 5(2)); anonymised when the user row is deleted (FK SET_NULL)"}
  retention: {exempt: legal_obligation, note: "audit trail kept for the life of the content it documents; the user reference is nulled on account deletion"}
