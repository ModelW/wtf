id: GDPR-RECIPIENT-DECLARED
title: Detected egress mapped to a declared recipient
frameworks: [gdpr]
applies_to: {kind: activity}
kind: gate
severity: high
version: 1
description: >-
  Every third party the activity's members send data to (SDK, host, API
  key) must appear in the activity's `recipients`. Undeclared recipients
  make the Art. 30(1)(d) record false.
mitigation: >-
  Add the recipient id to `recipients` (and describe it under
  `recipients/<id>.yaml`), or remove the egress from the code.
condition: set(gen_list(activity, "suggested_recipients")) <= set(activity.recipients)
references: ["Art. 30(1)(d)", "Art. 13(1)(e)"]
