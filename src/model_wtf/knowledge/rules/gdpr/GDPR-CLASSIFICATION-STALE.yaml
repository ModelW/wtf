id: GDPR-CLASSIFICATION-STALE
title: Declared contents match the extracted schema
frameworks: [gdpr]
applies_to: {kind: data_object}
kind: gate
severity: medium
version: 1
description: >-
  When the extractor finds a field the human declaration does not
  classify (or the declaration names a field that no longer exists), the
  registry's categories of personal data are out of date.
mitigation: >-
  Classify the new fields in `data/<id>.yaml` (use `item: none` for
  non-personal data) and remove entries for dropped fields.
condition: >-
  not has_gen(data_object)
  or set(gen_keys(data_object, "fields")) == set(data_object.fields)
references: ["Art. 30(1)(c)", "Art. 5(1)(d)"]
