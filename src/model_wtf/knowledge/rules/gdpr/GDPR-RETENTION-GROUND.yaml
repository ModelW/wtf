id: GDPR-RETENTION-GROUND
title: Long retention has a statutory ground
frameworks: [gdpr]
applies_to: {kind: data_object}
kind: gate
severity: medium
version: 1
description: >-
  Keeping personal data longer than three years after the trigger, or
  beyond the purpose, needs a legal ground (accounting law, litigation
  hold) cited on the retention entry.
mitigation: >-
  Add `statutory_basis` ("French Commercial Code Art. L123-22") or shorten
  the `time_limit`.
condition: >-
  all(r.statutory_basis or duration_years(r.time_limit or "") <= 3
      for r in data_object.retention)
references: ["Art. 17(3)(b)", "Art. 5(1)(e)"]
